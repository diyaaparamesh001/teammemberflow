<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flownt My Teams</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231a1a1f'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;800&display=swap">
<style>
/* Layout: app shell — sidebar | main (teams list or one team's details). Wireframe greys, ink as the only accent. */
:root {
  --bg: #ffffff;
  --side: #f4f4f6;
  --sunk: #f8f8fa;
  --chip: #e6e6ea;
  --line: #c4c4cb;
  --line-soft: #e2e2e7;
  --ink: #1a1a1f;
  --muted: #66666f;
  --scrim: rgba(20, 20, 26, .38);
  --font: "Figtree", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141417; --side: #1b1b1f; --sunk: #18181c; --chip: #2b2b31;
    --line: #4a4a53; --line-soft: #2e2e35; --ink: #ededf0; --muted: #a0a0aa;
    --scrim: rgba(0, 0, 0, .6); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141417; --side: #1b1b1f; --sunk: #18181c; --chip: #2b2b31;
  --line: #4a4a53; --line-soft: #2e2e35; --ink: #ededf0; --muted: #a0a0aa;
  --scrim: rgba(0, 0, 0, .6); color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.4; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

.app { display: grid; grid-template-columns: 260px minmax(0, 1fr); height: 100%; }

/* Sidebar */
.sidebar { background: var(--side); border-right: 1px solid var(--line-soft); padding: 24px 16px; display: flex; flex-direction: column; gap: 4px; overflow-y: auto; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 22px; padding: 0 8px 20px; }
.brand i { width: 28px; height: 28px; border-radius: 7px; background: var(--ink); display: block; }
.nav { display: flex; align-items: center; gap: 14px; padding: 12px 14px; border-radius: 8px; font-size: 16px; text-align: left; width: 100%; }
.nav i { width: 20px; height: 20px; border: 1.5px solid var(--muted); border-radius: 5px; flex: none; }
.nav:hover { background: var(--chip); }
.nav.on { background: var(--chip); font-weight: 600; }

/* Main */
.main { display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
.topbar { display: flex; align-items: center; gap: 16px; padding: 16px 40px; border-bottom: 1px solid var(--line-soft); }
.menu-btn { display: none; width: 40px; height: 40px; border: 1.5px solid var(--line); border-radius: 8px; font-size: 18px; flex: none; }
.search { position: relative; flex: 1; max-width: 520px; }
.search input { width: 100%; border: 1.5px solid var(--line); border-radius: 8px; padding: 11px 60px 11px 16px; background: var(--bg); }
.search kbd { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); font: 600 12px var(--font); border: 1px solid var(--line); border-radius: 5px; padding: 2px 7px; color: var(--muted); }
.results { position: absolute; top: calc(100% + 6px); left: 0; right: 0; background: var(--bg); border: 1.5px solid var(--line); border-radius: 8px; z-index: 30; padding: 6px; box-shadow: 0 10px 30px rgba(0,0,0,.12); }
.results button { display: flex; justify-content: space-between; gap: 12px; width: 100%; text-align: left; padding: 9px 10px; border-radius: 6px; }
.results button:hover, .results button.hl { background: var(--chip); }
.results small { color: var(--muted); }
.results p { padding: 10px; color: var(--muted); margin: 0; }
.me { margin-left: auto; width: 44px; height: 44px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--chip); font-weight: 800; font-size: 14px; flex: none; }

.content { overflow-y: auto; padding: 36px 40px 56px; flex: 1; }
.wrap { max-width: 960px; }
.head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 28px; }
h1 { font-size: 32px; font-weight: 800; margin: 0 0 6px; letter-spacing: -.01em; text-wrap: balance; }
.lede { color: var(--muted); margin: 0; font-size: 17px; }
.btn { border: 1.5px solid var(--line); border-radius: 8px; padding: 10px 18px; font-weight: 600; background: var(--bg); white-space: nowrap; }
.btn:hover { border-color: var(--ink); }
.btn.primary { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.btn.primary:hover { opacity: .88; }
.back { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-weight: 600; margin-bottom: 18px; }
.back:hover { color: var(--ink); }

/* Lists */
.list { border: 1.5px solid var(--line-soft); border-radius: var(--r); overflow: hidden; }
table { border-collapse: collapse; width: 100%; }
th, td { text-align: left; padding: 16px 20px; border-bottom: 1px solid var(--line-soft); vertical-align: middle; }
th { font-size: 13px; font-weight: 600; color: var(--muted); background: var(--sunk); }
tbody tr:last-child td { border-bottom: 0; }
tr.click { cursor: pointer; }
tr.click:hover td { background: var(--sunk); }
tr.click:focus-visible { outline: 2px solid var(--ink); outline-offset: -2px; }
tr.new td { animation: flash 1.6s ease-out; }
@keyframes flash { from { background: var(--chip); } to { background: transparent; } }
.team-name { font-weight: 800; font-size: 16px; }
.muted { color: var(--muted); }
.chev { color: var(--muted); text-align: right; width: 40px; }
.person { display: flex; align-items: center; gap: 12px; }
.av { width: 36px; height: 36px; border-radius: 50%; background: var(--chip); display: grid; place-items: center; font-weight: 800; font-size: 13px; flex: none; }
.av.lg { width: 64px; height: 64px; border-radius: 16px; font-size: 22px; }
.chip { display: inline-block; border: 1.5px solid var(--ink); border-radius: 5px; padding: 0 7px; font-weight: 800; font-size: 12px; margin-left: 8px; vertical-align: 1px; }
.num { font-variant-numeric: tabular-nums; }
.link { font-weight: 600; font-size: 14px; text-decoration: underline; text-underline-offset: 2px; color: var(--muted); }
.link:hover { color: var(--ink); }

/* Team details */
.team-head { display: flex; gap: 18px; align-items: center; }
.facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; margin-bottom: 28px; }
.fact { border: 1.5px solid var(--line-soft); border-radius: var(--r); padding: 14px 18px; }
.fact span { display: block; font-size: 13px; color: var(--muted); }
.fact b { font-size: 18px; font-weight: 800; }
.sec-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 12px; }
.sec-head h2 { font-size: 18px; font-weight: 800; margin: 0; }

.placeholder { border: 1.5px dashed var(--line); border-radius: 14px; padding: 60px 24px; text-align: center; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 14px; }
.placeholder h2 { color: var(--ink); margin: 0; font-size: 22px; }

/* Modal + toast */
.scrim { position: fixed; inset: 0; background: var(--scrim); display: grid; place-items: center; z-index: 50; padding: 16px; }
.modal { background: var(--bg); border-radius: 14px; width: 440px; max-width: 100%; padding: 24px; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 20px 60px rgba(0,0,0,.25); max-height: 90vh; overflow-y: auto; }
.modal h2 { margin: 0; font-size: 20px; font-weight: 800; }
.modal p { margin: 0; color: var(--muted); font-size: 14px; }
.modal label { display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600; }
.modal input, .modal select { border: 1.5px solid var(--line); border-radius: 8px; padding: 10px 12px; background: var(--bg); font-weight: 400; }
.modal .err { font-weight: 600; font-size: 13px; }
.modal .foot { display: flex; justify-content: flex-end; gap: 10px; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 11px 18px; border-radius: 8px; font-weight: 600; z-index: 60; max-width: calc(100vw - 32px); }

/* Responsive */
@media (max-width: 820px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .sidebar { position: fixed; top: 0; bottom: 0; left: 0; width: 260px; z-index: 45; transform: translateX(-100%); transition: transform .2s;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-top: calc(24px + env(safe-area-inset-top, 0px)); }
  .sidebar.open { transform: none; box-shadow: 10px 0 40px rgba(0,0,0,.18); }
  .menu-btn { display: grid; place-items: center; }
  .topbar, .content { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .topbar { gap: 10px; padding-top: calc(12px + env(safe-area-inset-top, 0px)); padding-bottom: 12px; }
  .content { padding-top: 24px; }
  .search kbd { display: none; }
  .search input { padding-right: 14px; }
  .me { width: 40px; height: 40px; }
  h1 { font-size: 26px; }
  .head .btn { width: 100%; }
  .facts { grid-template-columns: minmax(0, 1fr); gap: 10px; }
  .av.lg { width: 52px; height: 52px; font-size: 18px; }

  /* Tables become stacked rows */
  thead { display: none; }
  table, tbody, tr, td { display: block; }
  tr { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; padding: 14px 16px; border-bottom: 1px solid var(--line-soft); }
  tbody tr:last-child { border-bottom: 0; }
  td { padding: 0; border: 0; grid-column: 1; min-width: 0; }
  td.chev, td.side { grid-column: 2; grid-row: 1 / span 3; align-self: center; }
  tr.click:hover { background: var(--sunk); }
  tr.click:hover td { background: none; }
  td[data-label]::before { content: attr(data-label) ": "; color: var(--muted); }
  td.email { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><i></i>Flownt</div>
    <nav id="nav"></nav>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="menu-btn" data-action="menu" aria-label="Open menu">☰</button>
      <div class="search">
        <input id="q" type="text" placeholder="Search teams and people..." autocomplete="off" aria-label="Search teams and people">
        <kbd>⌘K</kbd>
        <div class="results" id="results" hidden></div>
      </div>
      <button class="me" aria-label="Your account" data-action="todo" data-what="Your account">YU</button>
    </header>
    <main class="content" id="content"></main>
  </div>
</div>
<div id="modal-root"></div>
<div class="toast" id="toast" hidden></div>

<script>
const m = (name, role) => ({ id: "u" + Math.random().toString(36).slice(2, 9), name, role });
const S = {
  nav: "teams",
  justCreated: null,
  teams: [
    { id: "engineering", name: "Engineering", about: "Builds and runs the Flownt platform.", created: "Mar 2023", members: [
      m("Sarah Lee", "Engineering Manager"), m("David Chen", "Staff Engineer"), m("Priya Nair", "Senior Frontend Engineer"),
      m("Marcus Johnson", "Backend Engineer"), m("Elena Rossi", "Backend Engineer"), m("Tom Becker", "DevOps Engineer"),
      m("Aisha Rahman", "Frontend Engineer"), m("Kenji Tanaka", "Mobile Engineer"), m("Lucas Silva", "QA Engineer"),
      m("Nora Fischer", "Data Engineer"), m("Omar Haddad", "Software Engineer"), m("Grace Park", "Software Engineer"),
    ] },
    { id: "product-design", name: "Product Design", about: "Designs how Flownt looks, feels and works.", created: "Jun 2023", members: [
      m("Arjun Kumar", "Design Lead"), m("Chloe Martin", "Senior Product Designer"), m("Diego Alvarez", "Product Designer"),
      m("Hannah Wright", "UX Researcher"), m("Ravi Patel", "Visual Designer"), m("Zoe Kim", "Content Designer"),
    ] },
    { id: "marketing", name: "Marketing", about: "Tells the world about Flownt and grows its audience.", created: "Sep 2023", members: [
      m("Maya Thomas", "Marketing Lead"), m("Ben Carter", "Growth Marketer"), m("Fatima Ali", "Content Strategist"),
      m("Liam O'Brien", "SEO Specialist"), m("Sofia Garcia", "Social Media Manager"), m("Jack Wilson", "Product Marketing Manager"),
      m("Mei Lin", "Brand Designer"), m("Noah Brooks", "Marketing Analyst"),
    ] },
  ],
};
S.teams.forEach((t) => (t.lead = t.members[0].id));

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const initials = (n) => n.trim().split(/\s+/).map((w) => w[0]).slice(0, 2).join("").toUpperCase();
const email = (n) => n.toLowerCase().replace(/[^a-z\s]/g, "").trim().replace(/\s+/g, ".") + "@flownt.com";
const members = (n) => `${n} member${n === 1 ? "" : "s"}`;
const team = (id) => S.teams.find((t) => t.id === id);
const leadOf = (t) => t.members.find((x) => x.id === t.lead);
const slug = (s) => s.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "team";

function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(() => (t.hidden = true), 2600);
}

/* ---------- Routing: #team-<id> opens a team, anything else shows the list ---------- */
const route = () => { const h = location.hash.slice(1); return h.startsWith("team-") ? h.slice(5) : null; };
const go = (hash) => { if (location.hash.slice(1) !== hash) location.hash = hash; else render(); };
window.addEventListener("hashchange", () => { S.nav = "teams"; render(); $("#content").scrollTop = 0; });

/* ---------- Render ---------- */
function render() {
  renderNav();
  const c = $("#content");
  if (S.nav !== "teams") { c.innerHTML = placeholder(); return; }
  const t = team(route());
  c.innerHTML = t ? teamView(t) : listView();
  document.title = t ? `${t.name} · Flownt` : "Flownt My Teams";
}

function renderNav() {
  const items = [["home", "Home"], ["needs", "Needs You"], ["teams", "My Teams"], ["workforce", "AI Workforce"], ["missions", "Missions"], ["outcomes", "Outcomes"]];
  $("#nav").innerHTML = items.map(([k, l]) => `<button class="nav ${S.nav === k ? "on" : ""}" data-action="nav" data-k="${k}"><i></i>${l}</button>`).join("");
}

function placeholder() {
  const label = { home: "Home", needs: "Needs You", workforce: "AI Workforce", missions: "Missions", outcomes: "Outcomes" }[S.nav];
  return `<div class="wrap"><h1>${label}</h1><p class="lede" style="margin-bottom:24px">This screen isn't part of the prototype yet.</p>
    <div class="placeholder"><h2>${label} goes here</h2><p>Only My Teams is clickable in this prototype.</p>
    <button class="btn primary" data-action="nav" data-k="teams">Go to My Teams</button></div></div>`;
}

function listView() {
  return `<div class="wrap">
    <div class="head">
      <div><h1>My Teams</h1><p class="lede">Manage the teams in your organization.</p></div>
      <button class="btn primary" data-action="create">+ Create Team</button>
    </div>
    <div class="list"><table>
      <thead><tr><th>Team</th><th>Team Lead</th><th>Members</th><th class="chev"><span hidden>Open</span></th></tr></thead>
      <tbody>${S.teams.map((t) => `
        <tr class="click ${S.justCreated === t.id ? "new" : ""}" tabindex="0" data-action="open" data-id="${t.id}" aria-label="Open ${esc(t.name)}">
          <td class="team-name">${esc(t.name)}</td>
          <td data-label="Lead">${esc(leadOf(t).name)}</td>
          <td class="muted num">${members(t.members.length)}</td>
          <td class="chev" aria-hidden="true">›</td>
        </tr>`).join("")}
      </tbody>
    </table></div>
  </div>`;
}

function teamView(t) {
  const lead = leadOf(t);
  const sorted = [lead, ...t.members.filter((x) => x.id !== t.lead)];
  return `<div class="wrap">
    <button class="back" data-action="back">‹ My Teams</button>
    <div class="head">
      <div class="team-head"><span class="av lg">${esc(initials(t.name))}</span>
        <div><h1>${esc(t.name)}</h1><p class="lede">${esc(t.about)}</p></div></div>
      <button class="btn primary" data-action="add-member" data-id="${t.id}">+ Add member</button>
    </div>
    <div class="facts">
      <div class="fact"><span>Team lead</span><b>${esc(lead.name)}</b></div>
      <div class="fact"><span>Members</span><b class="num">${t.members.length}</b></div>
      <div class="fact"><span>Created</span><b>${esc(t.created)}</b></div>
    </div>
    <div class="sec-head"><h2>Members</h2></div>
    <div class="list"><table>
      <thead><tr><th>Name</th><th>Role</th><th>Email</th><th><span hidden>Actions</span></th></tr></thead>
      <tbody>${sorted.map((x) => `
        <tr>
          <td><div class="person"><span class="av">${esc(initials(x.name))}</span><span><b>${esc(x.name)}</b>${x.id === t.lead ? `<span class="chip">Lead</span>` : ""}</span></div></td>
          <td class="muted">${esc(x.role)}</td>
          <td class="muted email">${esc(email(x.name))}</td>
          <td class="side" style="text-align:right">${x.id === t.lead ? "" : `<button class="link" data-action="make-lead" data-team="${t.id}" data-id="${x.id}">Make lead</button>`}</td>
        </tr>`).join("")}
      </tbody>
    </table></div>
  </div>`;
}

/* ---------- Modals ---------- */
function modal({ title, intro = "", fields, submit, onSubmit }) {
  $("#modal-root").innerHTML = `<div class="scrim" data-action="scrim"><form class="modal" id="mform" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <h2>${esc(title)}</h2>${intro ? `<p>${intro}</p>` : ""}${fields}
    <span class="err" id="merr" hidden></span>
    <div class="foot"><button type="button" class="btn" data-action="close-modal">Cancel</button><button class="btn primary" type="submit">${esc(submit)}</button></div>
  </form></div>`;
  const f = $("#mform");
  f.querySelector("input")?.focus();
  f.addEventListener("submit", (e) => {
    e.preventDefault();
    const err = onSubmit(Object.fromEntries(new FormData(f)));
    if (err) { const el = $("#merr"); el.textContent = err; el.hidden = false; return; }
    closeModal();
  });
}
const closeModal = () => ($("#modal-root").innerHTML = "");

function createTeam() {
  modal({
    title: "Create team", submit: "Create team",
    intro: "You can add more members after the team is created.",
    fields: `<label>Team name<input id="m-name" name="name" type="text" placeholder="e.g. Customer Success"></label>
      <label>Team lead<input id="m-lead" name="lead" type="text" placeholder="Full name"></label>
      <label>Lead's role<input id="m-role" name="role" type="text" placeholder="e.g. Customer Success Lead"></label>`,
    onSubmit: (d) => {
      const name = d.name.trim(), lead = d.lead.trim();
      if (!name) return "Enter a team name.";
      if (S.teams.some((t) => t.name.toLowerCase() === name.toLowerCase())) return `There's already a team called ${name}.`;
      if (!lead) return "Enter the team lead's name.";
      let id = slug(name); while (team(id)) id += "-2";
      const first = m(lead, d.role.trim() || "Team Lead");
      S.teams.push({ id, name, about: "A new team.", created: "Today", members: [first], lead: first.id });
      S.justCreated = id;
      go("");
      toast(`Created ${name}`);
    },
  });
}

function addMember(teamId) {
  const t = team(teamId);
  modal({
    title: `Add member to ${t.name}`, submit: "Add member",
    fields: `<label>Name<input id="m-mname" name="name" type="text" placeholder="Full name"></label>
      <label>Role<input id="m-mrole" name="role" type="text" placeholder="e.g. Software Engineer"></label>`,
    onSubmit: (d) => {
      const name = d.name.trim();
      if (!name) return "Enter a name.";
      t.members.push(m(name, d.role.trim() || "Team member"));
      render(); toast(`Added ${name} to ${t.name}`);
    },
  });
}

/* ---------- Search ---------- */
let hits = [], hl = 0;
function search() {
  const q = $("#q").value.trim().toLowerCase(), box = $("#results");
  if (!q) { box.hidden = true; return; }
  hits = [
    ...S.teams.filter((t) => t.name.toLowerCase().includes(q)).map((t) => ({ label: t.name, sub: `Team · ${members(t.members.length)}`, go: t.id })),
    ...S.teams.flatMap((t) => t.members.filter((x) => (x.name + " " + x.role).toLowerCase().includes(q)).map((x) => ({ label: x.name, sub: `${x.role} · ${t.name}`, go: t.id }))),
  ].slice(0, 8);
  hl = 0;
  box.innerHTML = hits.length ? hits.map((h, i) => `<button data-action="hit" data-i="${i}" class="${i === hl ? "hl" : ""}"><span>${esc(h.label)}</span><small>${esc(h.sub)}</small></button>`).join("") : `<p>Nothing matches "${esc(q)}".</p>`;
  box.hidden = false;
}
function pickHit(i) { const h = hits[i]; if (!h) return; $("#q").value = ""; $("#q").blur(); $("#results").hidden = true; S.nav = "teams"; go("team-" + h.go); }

/* ---------- Events ---------- */
document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-action]");
  if (!e.target.closest(".search")) $("#results").hidden = true;
  if (!e.target.closest("#sidebar") && !e.target.closest(".menu-btn")) $("#sidebar").classList.remove("open");
  if (!t) return;
  const { action: a, id } = t.dataset;
  switch (a) {
    case "nav": S.nav = t.dataset.k; $("#sidebar").classList.remove("open"); if (S.nav === "teams") go(""); else render(); break;
    case "menu": $("#sidebar").classList.toggle("open"); break;
    case "open": S.justCreated = null; go("team-" + id); break;
    case "back": go(""); break;
    case "create": createTeam(); break;
    case "add-member": addMember(id); break;
    case "make-lead": { const tm = team(t.dataset.team); tm.lead = id; render(); toast(`${leadOf(tm).name} now leads ${tm.name}`); break; }
    case "hit": pickHit(+t.dataset.i); break;
    case "close-modal": closeModal(); break;
    case "scrim": if (e.target === t) closeModal(); break;
    case "todo": toast(`${t.dataset.what} isn't part of this prototype`); break;
  }
});

document.addEventListener("keydown", (e) => {
  const row = e.target.closest?.("tr.click");
  if (row && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); row.click(); }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); $("#q").focus(); }
  if (e.key === "Escape") {
    if ($("#modal-root").innerHTML) closeModal();
    else if (!$("#results").hidden) { $("#results").hidden = true; $("#q").blur(); }
    else if (route()) go("");
  }
});

$("#q").addEventListener("input", search);
$("#q").addEventListener("focus", search);
$("#q").addEventListener("keydown", (e) => {
  const btns = [...document.querySelectorAll("#results button")];
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    e.preventDefault(); if (!btns.length) return;
    hl = (hl + (e.key === "ArrowDown" ? 1 : -1) + btns.length) % btns.length;
    btns.forEach((b, i) => b.classList.toggle("hl", i === hl));
  } else if (e.key === "Enter") { e.preventDefault(); pickHit(hl); }
});

render();
</script>
</body>
</html>
