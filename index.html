<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flownt Chat</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231a1a1f'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;800&display=swap">
<link rel="stylesheet" href="shell.css">
<style>
/* Chat: heading, message box, suggestion cards; a conversation docks the box at the bottom. Shared shell lives in shell.css. */
.content { display: flex; flex-direction: column; padding-top: 44px; }
.chat { width: 100%; max-width: 900px; display: flex; flex-direction: column; flex: 1; min-height: 0; }
.chat h1 { font-size: 32px; font-weight: 800; letter-spacing: -.01em; margin-bottom: 20px; }
.chat .lede { margin: -12px 0 20px; }

.composer { border: 1.5px solid var(--line); border-radius: 14px; background: var(--bg); padding: 18px 18px 14px 22px; display: flex; flex-direction: column; gap: 10px; min-height: 230px; }
.composer:focus-within { border-color: var(--accent); }
.composer textarea { flex: 1; border: 0; outline: none; resize: none; background: transparent; font-size: 17px; line-height: 1.5; min-height: 130px; padding: 4px 0 0; }
.composer textarea::placeholder { color: var(--muted); }
.send { align-self: flex-end; width: 46px; height: 46px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-size: 19px; font-weight: 800; flex: none; }
.send:disabled { opacity: .35; cursor: default; }

.cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; margin-top: 18px; }
.card { border: 1.5px solid var(--line-soft); border-radius: 12px; padding: 18px 20px; min-height: 120px; display: flex; flex-direction: column; gap: 6px; text-align: left; }
.card:hover { border-color: var(--accent); }
.card b { font-weight: 700; }
.card span { color: var(--muted); font-size: 14px; }

/* Conversation */
.thread { display: flex; flex-direction: column; gap: 14px; padding-bottom: 20px; flex: 1; }
.msg { max-width: min(78%, 620px); padding: 12px 15px; border-radius: 14px; line-height: 1.5; white-space: pre-wrap; overflow-wrap: break-word; }
.msg.mine { align-self: flex-end; background: var(--accent-soft); border-bottom-right-radius: 4px; }
.msg.ai { align-self: flex-start; border: 1.5px solid var(--line-soft); border-bottom-left-radius: 4px; }
.msg.ai small { display: block; font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: 3px; }
.msg.typing { color: var(--muted); }
.docked { position: sticky; bottom: 0; background: var(--bg); padding: 10px 0 4px; }
.docked .composer { min-height: 0; flex-direction: row; align-items: flex-end; padding: 10px 10px 10px 18px; }
.docked .composer textarea { min-height: 28px; max-height: 160px; padding: 9px 0; font-size: 16px; }

.list { border: 1.5px solid var(--line-soft); border-radius: var(--r); margin-top: 22px; }
.list h2 { font-size: 13px; font-weight: 700; color: var(--muted); padding: 12px 16px; border-bottom: 1px solid var(--line-soft); background: var(--sunk); border-radius: var(--r) var(--r) 0 0; }
.list a { display: flex; justify-content: space-between; gap: 12px; padding: 13px 16px; border-bottom: 1px solid var(--line-soft); color: inherit; text-decoration: none; }
.list a:last-child { border-bottom: 0; }
.list a:hover { background: var(--sunk); }

@media (max-width: 860px) {
  .content { padding-top: 26px; }
  .chat h1 { font-size: 26px; }
  .composer { min-height: 190px; }
  .composer textarea { min-height: 100px; }
  .cards { grid-template-columns: minmax(0, 1fr); gap: 10px; }
  .card { min-height: 0; }
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <main class="content" id="content"></main>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script src="shell.js"></script>
<script>
const $ = (s) => document.querySelector(s);
const esc = Shell.esc;
const SUGGESTIONS = [1, 2, 3].map((n) => ({ title: `Suggested prompt ${n}`, text: "Prompt description goes here." }));
const REPLY = "Placeholder reply from Flownt. This is where the answer to your message would appear.";

function composer(placeholder, docked) {
  return `<div class="${docked ? "docked" : ""}"><form class="composer" id="composer">
    <textarea id="msg" rows="${docked ? 1 : 5}" placeholder="${esc(placeholder)}" aria-label="Message"></textarea>
    <button class="send" id="send" type="submit" aria-label="Send" disabled>↑</button>
  </form></div>`;
}

/* Views: new chat (no hash), a project (#project-…), or a conversation (#chat-…) */
function render() {
  const key = location.hash.slice(1);
  const chat = Shell.chat(key), project = Shell.project(key);
  const c = $("#content");
  if (chat) {
    document.title = `${chat.title} · Flownt`;
    c.innerHTML = `<div class="chat"><h1>${esc(chat.title)}</h1>
      <div class="thread" id="thread">${chat.messages.map(bubble).join("")}</div>
      ${composer("Reply to Flownt...", true)}</div>`;
    c.scrollTop = c.scrollHeight;
  } else if (project) {
    document.title = `${project.title} · Flownt`;
    c.innerHTML = `<div class="chat"><h1>${esc(project.title)}</h1><p class="lede">Project description goes here.</p>
      ${composer(`Message Flownt about ${project.title}...`)}
      <div class="list"><h2>Chats in this project</h2>
        ${[1, 2, 3].map((n) => `<a href="#" data-chat-title="Chat title ${n}"><span>Chat title ${n}</span><span class="muted">Date</span></a>`).join("")}</div></div>`;
  } else {
    document.title = "Flownt Chat";
    c.innerHTML = `<div class="chat"><h1>Chat</h1>
      ${composer("Message Flownt...")}
      <div class="cards">${SUGGESTIONS.map((s, i) => `<button class="card" data-suggest="${i}"><b>${esc(s.title)}</b><span>${esc(s.text)}</span></button>`).join("")}</div></div>`;
  }
  Shell.refresh();
  wire(chat, project);
}

const bubble = (m) => m.from === "me"
  ? `<div class="msg mine">${esc(m.text)}</div>`
  : `<div class="msg ai ${m.typing ? "typing" : ""}"><small>Flownt</small>${esc(m.text)}</div>`;

function wire(chat, project) {
  const form = $("#composer"), box = $("#msg"), send = $("#send");
  const grow = () => { if (chat) { box.style.height = "auto"; box.style.height = box.scrollHeight + "px"; } };
  box.addEventListener("input", () => { send.disabled = !box.value.trim(); grow(); });
  box.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); } });
  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const text = box.value.trim();
    if (!text) return;
    if (chat) reply(chat, text);
    else startChat(text, project);
  });
  if (!matchMedia("(max-width: 860px)").matches) box.focus();
}

function startChat(text, project) {
  const title = text.length > 34 ? text.slice(0, 32).trimEnd() + "…" : text;
  const chat = { id: "chat-" + Date.now().toString(36), title, project: project?.id || null, messages: [] };
  Shell.addChat(chat);
  location.hash = chat.id;           // renders the conversation
  setTimeout(() => reply(chat, text), 0);
}

function reply(chat, text) {
  chat.messages.push({ from: "me", text });
  chat.messages.push({ from: "ai", text: "Flownt is typing…", typing: true });
  Shell.saveChats();
  render();
  setTimeout(() => {
    const last = chat.messages[chat.messages.length - 1];
    last.text = REPLY; delete last.typing;
    Shell.saveChats();
    if (location.hash.slice(1) === chat.id) render();
  }, 700);
}

document.addEventListener("click", (e) => {
  const s = e.target.closest("[data-suggest]");
  if (s) {
    const box = $("#msg"), item = SUGGESTIONS[+s.dataset.suggest];
    box.value = `${item.title}: ${item.text}`;
    $("#send").disabled = false;
    box.focus();
  }
  const pc = e.target.closest("[data-chat-title]");
  if (pc) {
    e.preventDefault();
    const chat = { id: "chat-" + Date.now().toString(36), title: pc.dataset.chatTitle, messages: [
      { from: "me", text: "Message text goes here." }, { from: "ai", text: REPLY }] };
    Shell.addChat(chat);
    location.hash = chat.id;
  }
});

window.addEventListener("hashchange", render);
Shell.mount("chat");
render();
</script>
</body>
</html>
