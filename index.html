<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flownt My Teams</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231a1a1f'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;800&display=swap">
<style>
/* Layout: app shell — sidebar | team list | team side sheet. Wireframe greys with muted status colours. */
:root {
  --bg: #ffffff;
  --side: #f4f4f6;
  --sunk: #f7f7f9;
  --chip: #e8e8ec;
  --line: #c4c4cb;
  --line-soft: #e2e2e7;
  --ink: #2b2d38;
  --accent: #5b6bd5;
  --accent-ink: #ffffff;
  --accent-soft: #eceefb;
  --muted: #66666f;
  --scrim: rgba(20, 20, 26, .38);
  --good: #2f7a4f; --good-bg: #e3f1e8;
  --warn: #8a5a00; --warn-bg: #fbefd6;
  --bad: #a3322b; --bad-bg: #f8e0de;
  --font: "Figtree", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141417; --side: #1b1b1f; --sunk: #19191d; --chip: #2b2b31;
    --line: #4a4a53; --line-soft: #2e2e35; --ink: #e6e7ee; --muted: #a0a0aa; --scrim: rgba(0, 0, 0, .6); --accent: #8e9bf0; --accent-ink: #141417; --accent-soft: #252a45;
    --good: #7cc79a; --good-bg: #1d3326; --warn: #e5b45a; --warn-bg: #3a2e14; --bad: #f08a80; --bad-bg: #3d1f1c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141417; --side: #1b1b1f; --sunk: #19191d; --chip: #2b2b31;
  --line: #4a4a53; --line-soft: #2e2e35; --ink: #e6e7ee; --muted: #a0a0aa; --scrim: rgba(0, 0, 0, .6); --accent: #8e9bf0; --accent-ink: #141417; --accent-soft: #252a45;
  --good: #7cc79a; --good-bg: #1d3326; --warn: #e5b45a; --warn-bg: #3a2e14; --bad: #f08a80; --bad-bg: #3d1f1c;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.4; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; text-align: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3, p { margin: 0; }

.app { display: grid; grid-template-columns: 248px minmax(0, 1fr); height: 100%; }
.app.has-panel { grid-template-columns: 248px minmax(0, 1fr) 420px; }

/* Sidebar */
.sidebar { background: var(--side); border-right: 1px solid var(--line-soft); padding: 22px 14px; display: flex; flex-direction: column; gap: 3px; overflow-y: auto; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 21px; padding: 0 8px 18px; }
.brand i { width: 26px; height: 26px; border-radius: 7px; background: var(--accent); display: block; }
.nav { display: flex; align-items: center; gap: 13px; padding: 11px 13px; border-radius: 8px; font-size: 15px; width: 100%; }
.nav i { width: 19px; height: 19px; border: 1.5px solid var(--muted); border-radius: 5px; flex: none; }
.nav:hover { background: var(--chip); }
.nav.on { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
.nav.on i { border-color: var(--accent); }

/* Main */
.main { display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
.topbar { display: flex; align-items: center; gap: 14px; padding: 14px 32px; border-bottom: 1px solid var(--line-soft); }
.menu-btn { display: none; width: 40px; height: 40px; border: 1.5px solid var(--line); border-radius: 8px; font-size: 18px; flex: none; place-items: center; }
.search { flex: 1; max-width: 460px; border: 1.5px solid var(--line); border-radius: 8px; padding: 10px 14px; background: var(--bg); }
.top-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
.needs-btn { display: flex; align-items: center; gap: 9px; border: 1.5px solid var(--line); border-radius: 99px; padding: 8px 10px 8px 15px; font-weight: 600; white-space: nowrap; }
.needs-btn b { background: var(--accent); color: var(--accent-ink); border-radius: 99px; min-width: 22px; height: 22px; display: grid; place-items: center; font-size: 12px; padding: 0 6px; }
.me { width: 42px; height: 42px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--chip); flex: none; }

.content { overflow-y: auto; padding: 30px 32px 56px; flex: 1; }
.ph { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
.ph h1 { font-size: 30px; font-weight: 800; letter-spacing: -.01em; margin-bottom: 4px; }
.lede { color: var(--muted); font-size: 16px; }
.acts { display: flex; gap: 8px; flex-wrap: wrap; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1.5px solid var(--line); border-radius: 8px; padding: 9px 16px; font-weight: 600; background: var(--bg); white-space: nowrap; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { opacity: .88; }
.btn.dashed { border-style: dashed; width: 100%; justify-content: flex-start; }
.btn.danger { color: var(--bad); }
.btn.sm { padding: 6px 11px; font-size: 13px; }

/* Team table */
.tw { border: 1.5px solid var(--line-soft); border-radius: var(--r); overflow-x: auto; }
.tname, td.meta, td .who { white-space: nowrap; }
table { border-collapse: collapse; width: 100%; }
th, td { text-align: left; padding: 14px 14px; border-bottom: 1px solid var(--line-soft); vertical-align: middle; font-size: 14px; }
th { font-size: 12px; font-weight: 700; color: var(--muted); background: var(--sunk); white-space: nowrap; }
tbody tr:last-child td { border-bottom: 0; }
tr.click { cursor: pointer; }
tr.click:hover td { background: var(--sunk); }
tr.click:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
tr.sel td { background: var(--accent-soft); }
tr.sel td:first-child { box-shadow: inset 3px 0 0 var(--accent); }
.tname { font-weight: 800; font-size: 15px; }
.chev { color: var(--muted); text-align: right; width: 36px; }
.who { display: flex; align-items: center; gap: 10px; min-width: 0; }
.av { width: 30px; height: 30px; border-radius: 50%; background: var(--chip); display: inline-grid; place-items: center; font-weight: 800; font-size: 11px; flex: none; }
.av.lg { width: 48px; height: 48px; font-size: 16px; }
.av.ai { border-radius: 8px; background: var(--bg); border: 1.5px dashed var(--muted); }
.tags { display: flex; flex-wrap: wrap; gap: 5px; }
.tag { display: inline-flex; align-items: center; border-radius: 6px; padding: 2px 8px; font-size: 12px; font-weight: 700; white-space: nowrap; background: var(--chip); }
.tag.good { color: var(--good); background: var(--good-bg); }
.tag.warn { color: var(--warn); background: var(--warn-bg); }
.tag.bad { color: var(--bad); background: var(--bad-bg); }
.tag.line { background: none; border: 1.5px solid var(--line); }
.muted { color: var(--muted); }

/* Side sheet */
.panel { border-left: 1px solid var(--line-soft); display: flex; flex-direction: column; min-width: 0; background: var(--bg); overflow: hidden; }
.p-head { display: flex; align-items: center; gap: 14px; padding: 22px 22px 0; }
.p-head h2 { font-size: 20px; font-weight: 800; }
.p-head small { color: var(--muted); font-size: 14px; }
.p-head .x { margin-left: auto; width: 40px; height: 40px; border: 1.5px solid var(--line); border-radius: 8px; font-size: 18px; flex: none; display: grid; place-items: center; }
.tabs { display: flex; gap: 20px; border-bottom: 1.5px solid var(--line-soft); padding: 0 22px; margin-top: 18px; overflow-x: auto; }
.tab { padding: 10px 0; font-weight: 600; color: var(--muted); border-bottom: 3px solid transparent; margin-bottom: -1.5px; white-space: nowrap; }
.tab.on { color: var(--accent); font-weight: 800; border-color: var(--accent); }
.p-body { overflow-y: auto; padding: 16px 22px 28px; flex: 1; display: flex; flex-direction: column; gap: 6px; }
.item { display: flex; align-items: center; gap: 12px; padding: 10px; margin: 0 -10px; border-radius: 8px; width: calc(100% + 20px); }
button.item:hover { background: var(--sunk); }
.item .tx { flex: 1; min-width: 0; }
.item .tx b { display: block; font-weight: 700; }
.item .tx small { display: block; color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar { height: 6px; background: var(--chip); border-radius: 99px; overflow: hidden; margin-top: 6px; }
.bar i { display: block; height: 100%; background: var(--accent); }
.sum { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-bottom: 10px; }
.sum div { border: 1.5px solid var(--line-soft); border-radius: 8px; padding: 10px 12px; }
.sum span { display: block; font-size: 12px; color: var(--muted); }
.sum b { font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; }
.level { border: 1.5px solid var(--line-soft); border-radius: 8px; padding: 12px 14px; margin-bottom: 4px; }
.level b { display: block; margin-bottom: 2px; }
.level small { color: var(--muted); font-size: 13px; }
.sec-label { font-size: 12px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); margin: 10px 0 2px; }
select.inline { border: 1.5px solid var(--line); border-radius: 7px; padding: 5px 8px; background: var(--bg); font-size: 13px; }

/* Modal + toast */
.scrim { position: fixed; inset: 0; background: var(--scrim); display: grid; place-items: center; z-index: 60; padding: 16px; }
.modal { background: var(--bg); border-radius: 14px; width: 460px; max-width: 100%; padding: 24px; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 20px 60px rgba(0,0,0,.25); max-height: 90vh; overflow-y: auto; }
.modal h2 { font-size: 20px; font-weight: 800; }
.modal .intro { color: var(--muted); font-size: 14px; }
.modal label.f { display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600; }
.modal input[type=text], .modal select { border: 1.5px solid var(--line); border-radius: 8px; padding: 10px 12px; background: var(--bg); font-weight: 400; width: 100%; }
.choice { display: flex; gap: 10px; align-items: flex-start; border: 1.5px solid var(--line-soft); border-radius: 8px; padding: 10px 12px; cursor: pointer; font-weight: 400; }
.choice:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.choice input { accent-color: var(--accent); }
.choice input { margin-top: 3px; }
.choice b { display: block; font-size: 14px; }
.choice small { color: var(--muted); font-size: 13px; }
.modal .err { color: var(--bad); font-weight: 600; font-size: 13px; }
.modal .foot { display: flex; justify-content: flex-end; gap: 10px; flex-wrap: wrap; }
.modal .foot .left { margin-right: auto; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 11px 18px; border-radius: 8px; font-weight: 600; z-index: 80; max-width: calc(100vw - 32px); }

/* Responsive */
@media (max-width: 1180px) {
  .app.has-panel { grid-template-columns: 248px minmax(0, 1fr); }
  .panel { position: fixed; top: 0; right: 0; bottom: 0; width: min(440px, 100vw); z-index: 50; box-shadow: -10px 0 40px rgba(0,0,0,.18);
    padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px); }
}
@media (max-width: 860px) {
  .app, .app.has-panel { grid-template-columns: minmax(0, 1fr); }
  .sidebar { position: fixed; top: 0; bottom: 0; left: 0; width: 260px; z-index: 55; transform: translateX(-100%); transition: transform .2s;
    padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-top: calc(22px + env(safe-area-inset-top, 0px)); }
  .sidebar.open { transform: none; box-shadow: 10px 0 40px rgba(0,0,0,.2); }
  .menu-btn { display: grid; }
  .topbar, .content { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .topbar { gap: 8px; padding-top: calc(10px + env(safe-area-inset-top, 0px)); padding-bottom: 10px; }
  .content { padding-top: 22px; }
  .needs-btn { padding: 7px 9px; }
  .needs-btn .lbl { display: none; }
  .me { width: 38px; height: 38px; }
  .ph h1 { font-size: 25px; }
  .acts { width: 100%; }
  .acts .btn { flex: 1; }

  /* Team table becomes stacked rows */
  thead { display: none; }
  table, tbody, tr, td { display: block; }
  tr { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 12px; padding: 14px 16px; border-bottom: 1px solid var(--line-soft); }
  tbody tr:last-child { border-bottom: 0; }
  td { padding: 0; border: 0; grid-column: 1; }
  td.chev { grid-column: 2; grid-row: 1 / span 4; align-self: center; }
  tr.click:hover td, tr.sel td { background: none; }
  tr.sel { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
  tr.sel td:first-child { box-shadow: none; }
  td.meta { color: var(--muted); font-size: 13px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><i></i>Flownt</div>
    <nav id="nav"></nav>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="menu-btn" data-action="menu" aria-label="Open menu">☰</button>
      <div class="search muted">Search or jump to…</div>
      <div class="top-right">
        <button class="needs-btn" data-action="todo" data-what="Needs You"><span class="lbl">Needs You</span> <b>X</b></button>
        <button class="me" aria-label="Your account" data-action="todo" data-what="Your account"></button>
      </div>
    </header>
    <main class="content" id="content"></main>
  </div>

  <aside class="panel" id="panel" hidden></aside>
</div>
<div id="modal-root"></div>
<div class="toast" id="toast" hidden></div>

<script>
const ACCESS = {
  Admin: "Manages the team, its people, AI roles and access.",
  Manager: "Manages their reports and approves AI role work.",
  Member: "Works on missions and uses the team's AI roles.",
};
const MODES = {
  suggest: ["Suggests", "Drafts work for a person to review."],
  approval: ["Acts with approval", "Does the work once a person approves it."],
  auto: ["Acts on its own", "Does the work and reports back."],
};
const STATUS = { good: "On track", warn: "At risk", bad: "Blocked" };

let uid = 1;
const id = () => "x" + uid++;
function makeTeam(letter, size, roles, missions) {
  const people = [];
  const lead = { id: id(), name: "Person name", title: "Title", manager: null, access: "Admin" };
  people.push(lead);
  const mgrs = [];
  for (let i = 1; i < size; i++) {
    const isMgr = i <= 2 && size > 6;
    const p = { id: id(), name: "Person name", title: "Title", manager: isMgr || !mgrs.length ? lead.id : mgrs[i % mgrs.length].id, access: isMgr ? "Manager" : "Member" };
    if (isMgr) mgrs.push(p);
    people.push(p);
  }
  return {
    id: "team-" + letter.toLowerCase(), name: "Team " + letter, people, lead: lead.id,
    roles: roles.map((mode, i) => ({ id: id(), name: "AI role " + (i + 1), mode, owner: people[(i + 1) % people.length].id })),
    missions: missions.map((status, i) => ({ id: id(), title: "Mission title", status, owner: people[i % people.length].id, progress: [60, 35, 20, 80][i % 4] })),
  };
}
const S = {
  teams: [
    makeTeam("A", 12, ["approval", "auto", "suggest"], ["good", "good", "warn", "bad"]),
    makeTeam("B", 6, ["suggest", "approval"], ["good", "good", "warn"]),
    makeTeam("C", 8, ["suggest", "auto"], ["good", "warn", "bad"]),
  ],
  selected: matchMedia("(min-width: 1181px)").matches ? "team-a" : null,
  tab: "people",
};

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const initials = (n) => n.trim().split(/\s+/).map((w) => w[0]).slice(0, 2).join("").toUpperCase() || "?";
const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;
const team = (tid) => S.teams.find((t) => t.id === tid);
const person = (t, pid) => t.people.find((p) => p.id === pid);
const leadOf = (t) => person(t, t.lead);
// Placeholder names repeat, so pickers number people in list order.
const label = (t, p) => `${p.name} ${t.people.indexOf(p) + 1}${p.title ? " · " + p.title : ""}`;
const peopleOptions = (t, sel, exclude = []) => t.people.filter((p) => !exclude.includes(p.id))
  .map((p) => `<option value="${p.id}" ${p.id === sel ? "selected" : ""}>${esc(label(t, p))}</option>`).join("");

function toast(msg) {
  const el = $("#toast"); el.textContent = msg; el.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(() => (el.hidden = true), 2400);
}

function health(t) {
  const n = (s) => t.missions.filter((m) => m.status === s).length;
  const out = [["good", "on track"], ["warn", "at risk"], ["bad", "blocked"]].filter(([s]) => n(s)).map(([s, l]) => `<span class="tag ${s}">${n(s)} ${l}</span>`).join("");
  return out || `<span class="muted">No missions</span>`;
}

/* ---------- Render ---------- */
function render() {
  $("#nav").innerHTML = ["Home", "Needs You", "My Teams", "AI Workforce", "Missions", "Outcomes"]
    .map((n) => `<button class="nav ${n === "My Teams" ? "on" : ""}" data-action="${n === "My Teams" ? "home" : "todo"}" data-what="${n}"><i></i>${n}</button>`).join("");

  $("#content").innerHTML = `
    <div class="ph">
      <div><h1>My Teams</h1><p class="lede">Page description goes here.</p></div>
      <div class="acts"><button class="btn" data-action="set-role">Set up AI role</button><button class="btn primary" data-action="create-team">+ Create Team</button></div>
    </div>
    <div class="tw"><table>
      <thead><tr><th>Team</th><th>Team lead</th><th>Members</th><th>AI roles</th><th>Missions</th><th class="chev"></th></tr></thead>
      <tbody>${S.teams.map((t) => {
        const l = leadOf(t);
        return `<tr class="click ${S.selected === t.id ? "sel" : ""}" tabindex="0" data-action="open" data-id="${t.id}" aria-label="Open ${esc(t.name)}">
          <td class="tname">${esc(t.name)}</td>
          <td><span class="who"><span class="av">${esc(initials(l.name))}</span>${esc(l.name)}</span></td>
          <td class="meta">${plural(t.people.length, "member")}</td>
          <td class="meta">${plural(t.roles.length, "role")}</td>
          <td><span class="tags">${health(t)}</span></td>
          <td class="chev" aria-hidden="true">›</td>
        </tr>`;
      }).join("")}</tbody>
    </table></div>`;
  renderPanel();
}

function renderPanel() {
  const t = team(S.selected), panel = $("#panel");
  $("#app").classList.toggle("has-panel", !!t);
  panel.hidden = !t;
  if (!t) return;
  const tabs = [["people", "People"], ["roles", "AI roles"], ["missions", "Missions"], ["access", "Access"]];
  panel.innerHTML = `
    <div class="p-head"><span class="av lg">${esc(t.name.replace(/^Team\s+/, "").slice(0, 2).toUpperCase())}</span>
      <div><h2>${esc(t.name)}</h2><small>Led by ${esc(leadOf(t).name)} · ${plural(t.people.length, "member")}</small></div>
      <button class="x" data-action="close" aria-label="Close">✕</button></div>
    <div class="tabs" role="tablist">${tabs.map(([k, l]) => `<button class="tab ${S.tab === k ? "on" : ""}" role="tab" aria-selected="${S.tab === k}" data-action="tab" data-k="${k}">${l}</button>`).join("")}</div>
    <div class="p-body">${({ people: peopleTab, roles: rolesTab, missions: missionsTab, access: accessTab })[S.tab](t)}</div>`;
}

function peopleTab(t) {
  const lead = leadOf(t);
  const ordered = [lead, ...t.people.filter((p) => p !== lead)];
  return ordered.map((p) => {
    const mgr = person(t, p.manager);
    return `<button class="item" data-action="edit-person" data-id="${p.id}">
      <span class="av">${esc(initials(p.name))}</span>
      <span class="tx"><b>${esc(p.name)}</b><small>${esc(p.title)}${mgr ? ` · reports to ${esc(mgr.name)}` : p === lead ? " · team lead" : ""}</small></span>
      <span class="tag">${p.access}</span></button>`;
  }).join("") + `<button class="btn dashed" data-action="add-person" style="margin-top:8px">+ Add person</button>`;
}

function rolesTab(t) {
  return (t.roles.length ? t.roles.map((r) => `<button class="item" data-action="edit-role" data-id="${r.id}">
      <span class="av ai">AI</span>
      <span class="tx"><b>${esc(r.name)}</b><small>Accountable: ${esc(person(t, r.owner)?.name || "Nobody")}</small></span>
      <span class="tag line">${MODES[r.mode][0]}</span></button>`).join("")
    : `<p class="muted">No AI roles on this team yet.</p>`) + `<button class="btn dashed" data-action="set-role" data-team="${t.id}" style="margin-top:8px">+ Turn on AI role</button>`;
}

function missionsTab(t) {
  return (t.missions.length ? t.missions.map((m) => `<button class="item" data-action="edit-mission" data-id="${m.id}">
      <span class="tx"><b>${esc(m.title)}</b><small>Owner: ${esc(person(t, m.owner)?.name || "Nobody")} · ${m.progress}%</small><div class="bar"><i style="width:${m.progress}%"></i></div></span>
      <span class="tag ${m.status}">${STATUS[m.status]}</span></button>`).join("")
    : `<p class="muted">No missions yet.</p>`) + `<button class="btn dashed" data-action="add-mission" style="margin-top:8px">+ Add mission</button>`;
}

function accessTab(t) {
  const count = (lvl) => t.people.filter((p) => p.access === lvl).length;
  return `<div class="sum">${Object.keys(ACCESS).map((l) => `<div><span>${l}s</span><b>${count(l)}</b></div>`).join("")}</div>
    ${Object.entries(ACCESS).map(([l, d]) => `<div class="level"><b>${l}</b><small>${d}</small></div>`).join("")}
    <div class="sec-label">People</div>
    ${t.people.map((p) => `<div class="item"><span class="av">${esc(initials(p.name))}</span><span class="tx"><b>${esc(p.name)}</b><small>${esc(p.title)}</small></span>
      <select class="inline" data-action="set-access" data-id="${p.id}" aria-label="Access for ${esc(label(t, p))}" ${p.id === t.lead ? "disabled" : ""}>
        ${Object.keys(ACCESS).map((l) => `<option ${p.access === l ? "selected" : ""}>${l}</option>`).join("")}</select></div>`).join("")}`;
}

/* ---------- Modals ---------- */
function modal({ title, intro = "", fields, submit, extra = "", onSubmit }) {
  $("#modal-root").innerHTML = `<div class="scrim" data-action="scrim"><form class="modal" id="mform" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <h2>${esc(title)}</h2>${intro ? `<p class="intro">${intro}</p>` : ""}${fields}
    <span class="err" id="merr" hidden></span>
    <div class="foot">${extra}<button type="button" class="btn" data-action="close-modal">Cancel</button><button class="btn primary" type="submit">${esc(submit)}</button></div>
  </form></div>`;
  const f = $("#mform");
  f.querySelector("input[type=text], select")?.focus();
  f.addEventListener("submit", (e) => {
    e.preventDefault();
    const err = onSubmit(Object.fromEntries(new FormData(f)));
    if (err) { const el = $("#merr"); el.textContent = err; el.hidden = false; return; }
    closeModal(); render();
  });
}
const closeModal = () => ($("#modal-root").innerHTML = "");
const accessSelect = (sel = "Member") => `<select id="m-access" name="access">${Object.keys(ACCESS).map((l) => `<option ${l === sel ? "selected" : ""}>${l}</option>`).join("")}</select>`;
const modeChoices = (sel = "suggest") => Object.entries(MODES).map(([k, [l, d]]) =>
  `<label class="choice"><input type="radio" name="mode" value="${k}" ${k === sel ? "checked" : ""}><span><b>${l}</b><small>${d}</small></span></label>`).join("");

function createTeam() {
  const next = "Team " + String.fromCharCode(65 + S.teams.length);
  modal({
    title: "Create team", submit: "Create team", intro: "You can add people, AI roles and missions after it's created.",
    fields: `<label class="f">Team name<input id="m-tname" name="name" type="text" value="${next}"></label>
      <label class="f">Team lead<input id="m-tlead" name="lead" type="text" value="Person name"></label>`,
    onSubmit: (d) => {
      const name = d.name.trim(); if (!name) return "Enter a team name.";
      if (S.teams.some((t) => t.name.toLowerCase() === name.toLowerCase())) return "A team with that name already exists.";
      const lead = { id: id(), name: d.lead.trim() || "Person name", title: "Title", manager: null, access: "Admin" };
      const t = { id: "team-" + id(), name, people: [lead], lead: lead.id, roles: [], missions: [] };
      S.teams.push(t); S.selected = t.id; S.tab = "people";
      toast(`Created ${name}`);
    },
  });
}

function addPerson() {
  const t = team(S.selected);
  modal({
    title: `Add person to ${t.name}`, submit: "Add person",
    fields: `<label class="f">Name<input id="m-pname" name="name" type="text" value="Person name"></label>
      <label class="f">Title<input id="m-ptitle" name="title" type="text" value="Title"></label>
      <label class="f">Reports to<select id="m-pmgr" name="manager">${peopleOptions(t, t.lead)}</select></label>
      <label class="f">Access${accessSelect()}</label>`,
    onSubmit: (d) => {
      t.people.push({ id: id(), name: d.name.trim() || "Person name", title: d.title.trim() || "Title", manager: d.manager, access: d.access });
      S.tab = "people"; toast("Person added");
    },
  });
}

function editPerson(pid) {
  const t = team(S.selected), p = person(t, pid), isLead = pid === t.lead;
  const below = (x) => t.people.filter((q) => q.manager === x).flatMap((q) => [q.id, ...below(q.id)]);
  modal({
    title: "Edit person", submit: "Save",
    fields: `<label class="f">Name<input id="m-ename" name="name" type="text" value="${esc(p.name)}"></label>
      <label class="f">Title<input id="m-etitle" name="title" type="text" value="${esc(p.title)}"></label>
      ${isLead ? `<p class="intro">This person leads ${esc(t.name)} and doesn't report to anyone on the team.</p>`
        : `<label class="f">Reports to<select id="m-emgr" name="manager">${peopleOptions(t, p.manager, [pid, ...below(pid)])}</select></label>
      <label class="f">Access${accessSelect(p.access)}</label>`}`,
    extra: isLead ? "" : `<button type="button" class="btn danger left" data-action="remove-person" data-id="${pid}">Remove</button>`,
    onSubmit: (d) => {
      p.name = d.name.trim() || "Person name"; p.title = d.title.trim() || "Title";
      if (!isLead) { p.manager = d.manager; p.access = d.access; }
      toast("Saved");
    },
  });
}

function setRole(teamId) {
  const t = team(teamId || S.selected) || S.teams[0];
  modal({
    title: "Set up AI role", submit: "Turn on", intro: "Choose a team, then decide how the AI role takes part in the work.",
    fields: `<label class="f">Team<select id="m-rteam" name="team" data-action="role-team">${S.teams.map((x) => `<option value="${x.id}" ${x === t ? "selected" : ""}>${esc(x.name)}</option>`).join("")}</select></label>
      <label class="f">AI role name<input id="m-rname" name="name" type="text" value="AI role ${t.roles.length + 1}"></label>
      <div class="f" style="display:flex;flex-direction:column;gap:8px;font-weight:600;font-size:14px">How it takes part${modeChoices()}</div>
      <label class="f">Accountable person<select id="m-rowner" name="owner">${peopleOptions(t, t.lead)}</select></label>`,
    onSubmit: (d) => {
      const tt = team(d.team);
      tt.roles.push({ id: id(), name: d.name.trim() || "AI role", mode: d.mode, owner: d.owner });
      S.selected = tt.id; S.tab = "roles"; toast("AI role turned on");
    },
  });
}

function editRole(rid) {
  const t = team(S.selected), r = t.roles.find((x) => x.id === rid);
  modal({
    title: r.name, submit: "Save",
    fields: `<div class="f" style="display:flex;flex-direction:column;gap:8px;font-weight:600;font-size:14px">How it takes part${modeChoices(r.mode)}</div>
      <label class="f">Accountable person<select id="m-eowner" name="owner">${peopleOptions(t, r.owner)}</select></label>`,
    extra: `<button type="button" class="btn danger left" data-action="remove-role" data-id="${rid}">Turn off</button>`,
    onSubmit: (d) => { r.mode = d.mode; r.owner = d.owner; toast("Saved"); },
  });
}

function editMission(mid) {
  const t = team(S.selected), m = mid ? t.missions.find((x) => x.id === mid) : null;
  modal({
    title: m ? "Mission" : "Add mission", submit: m ? "Save" : "Add mission",
    fields: `<label class="f">Mission title<input id="m-mtitle" name="title" type="text" value="${esc(m ? m.title : "Mission title")}"></label>
      <label class="f">Owner<select id="m-mowner" name="owner">${peopleOptions(t, m ? m.owner : t.lead)}</select></label>
      <label class="f">Status<select id="m-mstatus" name="status">${Object.entries(STATUS).map(([k, l]) => `<option value="${k}" ${(m ? m.status : "good") === k ? "selected" : ""}>${l}</option>`).join("")}</select></label>`,
    onSubmit: (d) => {
      const vals = { title: d.title.trim() || "Mission title", owner: d.owner, status: d.status };
      if (m) Object.assign(m, vals); else t.missions.push({ id: id(), progress: 0, ...vals });
      toast(m ? "Saved" : "Mission added");
    },
  });
}

/* ---------- Events ---------- */
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-action]");
  if (!e.target.closest("#sidebar") && !e.target.closest(".menu-btn")) $("#sidebar").classList.remove("open");
  if (!el) return;
  const { action: a, id: tid } = el.dataset;
  switch (a) {
    case "menu": $("#sidebar").classList.toggle("open"); break;
    case "home": $("#sidebar").classList.remove("open"); break;
    case "open": S.selected = tid; S.tab = "people"; render(); break;
    case "close": S.selected = null; render(); break;
    case "tab": S.tab = el.dataset.k; renderPanel(); break;
    case "create-team": createTeam(); break;
    case "add-person": addPerson(); break;
    case "edit-person": editPerson(tid); break;
    case "set-role": setRole(el.dataset.team); break;
    case "edit-role": editRole(tid); break;
    case "add-mission": editMission(); break;
    case "edit-mission": editMission(tid); break;
    case "remove-person": {
      const t = team(S.selected), p = person(t, tid);
      t.people.filter((q) => q.manager === tid).forEach((q) => (q.manager = p.manager));
      t.roles.forEach((r) => r.owner === tid && (r.owner = t.lead));
      t.missions.forEach((m) => m.owner === tid && (m.owner = t.lead));
      t.people = t.people.filter((q) => q.id !== tid);
      closeModal(); render(); toast("Person removed"); break;
    }
    case "remove-role": { const t = team(S.selected); t.roles = t.roles.filter((r) => r.id !== tid); closeModal(); render(); toast("AI role turned off"); break; }
    case "close-modal": closeModal(); break;
    case "scrim": if (e.target === el) closeModal(); break;
    case "todo": toast(`${el.dataset.what} isn't part of this prototype`); break;
  }
});

document.addEventListener("change", (e) => {
  const el = e.target;
  if (el.dataset.action === "set-access") { const t = team(S.selected); person(t, el.dataset.id).access = el.value; render(); toast("Access updated"); }
  if (el.dataset.action === "role-team") {
    const t = team(el.value);
    $("#m-rowner").innerHTML = peopleOptions(t, t.lead);
    $("#m-rname").value = "AI role " + (t.roles.length + 1);
  }
});

document.addEventListener("keydown", (e) => {
  const row = e.target.closest?.("tr.click");
  if (row && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); row.click(); }
  if (e.key === "Escape") {
    if ($("#modal-root").innerHTML) closeModal();
    else if (S.selected) { S.selected = null; render(); }
  }
});

render();
</script>
</body>
</html>
