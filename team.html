<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flownt My Team</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231a1a1f'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;800&display=swap">
<link rel="stylesheet" href="shell.css">
<style>
/* My Team: team list | team side sheet. Shared tokens and shell live in shell.css. */
.app.has-panel { grid-template-columns: 248px minmax(0, 1fr) 420px; }
.acts { display: flex; gap: 8px; flex-wrap: wrap; }
.btn.dashed { border-style: dashed; width: 100%; justify-content: flex-start; }
.btn.danger { color: var(--bad); }
.btn.sm { padding: 6px 11px; font-size: 13px; }

.stats { display: flex; gap: 12px; margin-bottom: 24px; }
.stat { width: 136px; max-width: 100%; aspect-ratio: 1; flex: 0 1 136px; min-width: 0; border: 1.5px solid var(--line-soft); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; }
.stat b { margin-top: 6px; }
.stat small { margin-top: auto; line-height: 1.3; }
.stat span { display: block; font-size: 13px; font-weight: 600; color: var(--muted); }
.stat b { display: block; font-size: 30px; font-weight: 800; line-height: 1.25; font-variant-numeric: tabular-nums; }
.stat small { color: var(--muted); font-size: 13px; }

/* Team table */
.tw { border: 1.5px solid var(--line-soft); border-radius: var(--r); overflow-x: auto; max-width: 560px; }
.who-tx small { display: block; color: var(--muted); font-size: 13px; }
.tname, td.meta, td .who { white-space: nowrap; }
table { border-collapse: collapse; width: 100%; }
th, td { text-align: left; padding: 14px 14px; border-bottom: 1px solid var(--line-soft); vertical-align: middle; font-size: 14px; }
th { font-size: 12px; font-weight: 700; color: var(--muted); background: var(--sunk); white-space: nowrap; }
tbody tr:last-child td { border-bottom: 0; }
tr.click { cursor: pointer; }
tr.click:hover td { background: var(--sunk); }
tr.click:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
tr.sel td { background: var(--accent-soft); }
tr.sel td:first-child { box-shadow: inset 3px 0 0 var(--accent); }
.tname { font-weight: 800; font-size: 15px; }
.chev { color: var(--muted); text-align: right; width: 36px; }
.who { display: flex; align-items: center; gap: 10px; min-width: 0; }
.av { width: 30px; height: 30px; border-radius: 50%; background: var(--chip); display: inline-grid; place-items: center; font-weight: 800; font-size: 11px; flex: none; }
.av.lg { width: 48px; height: 48px; font-size: 16px; }
.tags { display: flex; flex-wrap: wrap; gap: 5px; }
.tag { display: inline-flex; align-items: center; border-radius: 6px; padding: 2px 8px; font-size: 12px; font-weight: 700; white-space: nowrap; background: var(--chip); }
.tag.good { color: var(--good); background: var(--good-bg); }
.tag.warn { color: var(--warn); background: var(--warn-bg); }
.tag.bad { color: var(--bad); background: var(--bad-bg); }
.tag.line { background: none; border: 1.5px solid var(--line); }

/* Side sheet */
.panel { border-left: 1px solid var(--line-soft); display: flex; flex-direction: column; min-width: 0; background: var(--bg); overflow: hidden; }
.p-head { display: flex; align-items: center; gap: 14px; padding: 22px 22px 0; }
.p-head h2 { font-size: 20px; font-weight: 800; }
.p-head small { color: var(--muted); font-size: 14px; }
.p-about { padding: 12px 22px 0; color: var(--muted); font-size: 14px; }
.modal textarea { resize: vertical; font: inherit; }
.modal .f small { font-weight: 400; color: var(--muted); }
.modal div.f { display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
.modal div.f > span { font-weight: 600; }
.modal { justify-self: center; }
.p-rows { display: flex; flex-direction: column; gap: 8px; }
.p-row { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr) 36px; gap: 8px; align-items: center; }
.row-x { width: 36px; height: 36px; border-radius: 8px; color: var(--muted); display: grid; place-items: center; }
.row-x:hover { background: var(--chip); color: var(--ink); }
.p-head .x { margin-left: auto; width: 40px; height: 40px; border: 1.5px solid var(--line); border-radius: 8px; font-size: 18px; flex: none; display: grid; place-items: center; }
.p-sum { display: flex; gap: 10px; padding: 16px 22px 0; }
.p-stat { border: 1.5px solid var(--line-soft); border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.p-stat:first-child { flex: none; width: 96px; }
.p-stat:last-child { flex: 1; }
.p-stat > span:first-child { font-size: 12px; font-weight: 600; color: var(--muted); }
.p-stat b { font-size: 22px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.tabs { display: flex; gap: 20px; border-bottom: 1.5px solid var(--line-soft); padding: 0 22px; margin-top: 18px; overflow-x: auto; }
.tab { padding: 10px 0; font-weight: 600; color: var(--muted); border-bottom: 3px solid transparent; margin-bottom: -1.5px; white-space: nowrap; }
.tab.on { color: var(--accent); font-weight: 800; border-color: var(--accent); }
.p-body { overflow-y: auto; padding: 16px 22px 28px; flex: 1; display: flex; flex-direction: column; gap: 6px; }
.item { display: flex; align-items: center; gap: 12px; padding: 10px; margin: 0 -10px; border-radius: 8px; width: calc(100% + 20px); }
button.item:hover { background: var(--sunk); }
.item .tx { flex: 1; min-width: 0; }
.item .tx b { display: block; font-weight: 700; }
.item .tx small { display: block; color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sum { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-bottom: 10px; }
.sum div { border: 1.5px solid var(--line-soft); border-radius: 8px; padding: 10px 12px; }
.sum span { display: block; font-size: 12px; color: var(--muted); }
.sum b { font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; }
.level { border: 1.5px solid var(--line-soft); border-radius: 8px; padding: 12px 14px; margin-bottom: 4px; }
.level b { display: block; margin-bottom: 2px; }
.level small { color: var(--muted); font-size: 13px; }
.sec-label { font-size: 12px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); margin: 10px 0 2px; }
.p-search { border: 1.5px solid var(--line); border-radius: 8px; padding: 9px 12px; background: var(--bg); width: 100%; margin: 4px 0 6px; }
.p-search:focus { border-color: var(--accent); outline: none; }
.no-match { font-size: 14px; padding: 6px 0; }
select.inline { border: 1.5px solid var(--line); border-radius: 7px; padding: 5px 8px; background: var(--bg); font-size: 13px; }

/* Modal + toast */
.scrim { position: fixed; inset: 0; background: var(--scrim); display: grid; place-items: center; z-index: 60; padding: 16px; grid-template-columns: minmax(0, 1fr); }
.modal { background: var(--bg); border-radius: 14px; width: 460px; max-width: 100%; padding: 24px; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 20px 60px rgba(0,0,0,.25); max-height: 90vh; overflow-y: auto; }
.modal h2 { font-size: 20px; font-weight: 800; }
.modal .intro { color: var(--muted); font-size: 14px; }
.modal label.f { display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600; }
.modal input[type=text], .modal select, .modal textarea { border: 1.5px solid var(--line); border-radius: 8px; padding: 10px 12px; background: var(--bg); font-weight: 400; width: 100%; }
.modal .err { color: var(--bad); font-weight: 600; font-size: 13px; }
.modal .foot { display: flex; justify-content: flex-end; gap: 10px; flex-wrap: wrap; }
.modal .foot .left { margin-right: auto; }

/* Responsive */
@media (max-width: 1180px) {
  .app.has-panel { grid-template-columns: 248px minmax(0, 1fr); }
  .panel { position: fixed; top: 0; right: 0; bottom: 0; width: min(440px, 100vw); z-index: 50; box-shadow: -10px 0 40px rgba(0,0,0,.18);
    padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px); }
}
@media (max-width: 860px) {
  .app.has-panel { grid-template-columns: minmax(0, 1fr); }
  .acts { width: 100%; }
  .acts .btn { flex: 1; }
  .stat { padding: 12px; }
  .stat span { min-height: 2.6em; }

  /* Team table becomes stacked rows */
  thead { display: none; }
  table, tbody, tr, td { display: block; }
  tr { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 12px; padding: 14px 16px; border-bottom: 1px solid var(--line-soft); }
  tbody tr:last-child { border-bottom: 0; }
  td { padding: 0; border: 0; grid-column: 1; }
  td.chev { grid-column: 2; grid-row: 1 / span 4; align-self: center; }
  tr.click:hover td, tr.sel td { background: none; }
  tr.sel { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
  tr.sel td:first-child { box-shadow: none; }
  td.meta { color: var(--muted); font-size: 13px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="sidebar" id="sidebar"></aside>

  <div class="main">
    <header class="topbar" id="topbar"></header>
    <main class="content" id="content"></main>
  </div>

  <aside class="panel" id="panel" hidden></aside>
</div>
<div id="modal-root"></div>
<div class="toast" id="toast" hidden></div>

<script src="shell.js"></script>
<script>
const ACCESS = {
  Admin: "Manages the team, its people, AI roles and access.",
  Captain: "Leads their reports and approves AI role work.",
  Member: "Works on missions and uses the team's AI roles.",
};

let uid = 1;
const id = () => "x" + uid++;
function makeTeam(letter, size, roleCount, missions) {
  const people = [];
  const lead = { id: id(), name: "Person name", title: "Title", manager: null, access: "Admin" };
  people.push(lead);
  const mgrs = [];
  for (let i = 1; i < size; i++) {
    const isMgr = i <= 2 && size > 6;
    const p = { id: id(), name: "Person name", title: "Title", manager: isMgr || !mgrs.length ? lead.id : mgrs[i % mgrs.length].id, access: isMgr ? "Captain" : "Member" };
    if (isMgr) mgrs.push(p);
    people.push(p);
  }
  return {
    id: "team-" + letter.toLowerCase(), name: "Team " + letter, about: "Team purpose goes here.", people, lead: lead.id,
    roles: Array.from({ length: roleCount }, (_, i) => ({ id: id(), name: "AI role " + (i + 1) })),
    missions: missions.map((status) => ({ id: id(), status })),
  };
}
const S = {
  teams: [
    makeTeam("A", 12, 3, ["good", "good", "warn", "bad"]),
    makeTeam("B", 6, 2, ["good", "good", "warn"]),
    makeTeam("C", 8, 2, ["good", "warn", "bad"]),
  ],
  selected: matchMedia("(min-width: 1181px)").matches ? "team-a" : null,
  tab: "people",
};

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const initials = (n) => n.trim().split(/\s+/).map((w) => w[0]).slice(0, 2).join("").toUpperCase() || "?";
const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;
const team = (tid) => S.teams.find((t) => t.id === tid);
const person = (t, pid) => t.people.find((p) => p.id === pid);
const leadOf = (t) => person(t, t.lead);
// Placeholder names repeat, so pickers number people in list order.
const label = (t, p) => `${p.name} ${t.people.indexOf(p) + 1}${p.title ? " · " + p.title : ""}`;
const peopleOptions = (t, sel, exclude = []) => t.people.filter((p) => !exclude.includes(p.id))
  .map((p) => `<option value="${p.id}" ${p.id === sel ? "selected" : ""}>${esc(label(t, p))}</option>`).join("");

const toast = Shell.toast;

function health(t) {
  const n = (s) => t.missions.filter((m) => m.status === s).length;
  const out = [["good", "on track"], ["warn", "at risk"], ["bad", "blocked"]].filter(([s]) => n(s)).map(([s, l]) => `<span class="tag ${s}">${n(s)} ${l}</span>`).join("");
  return out || `<span class="muted">No missions</span>`;
}

/* ---------- Render ---------- */
function render() {
  $("#content").innerHTML = `
    <div class="ph">
      <div><h1>Team Name</h1><p class="lede">Page description goes here.</p></div>
      <div class="acts"><button class="btn primary" data-action="create-team">+ Create Team</button></div>
    </div>
    <div class="stats">
      <div class="stat"><span>Teams</span><b>${S.teams.length}</b><small>In your organization</small></div>
      <div class="stat"><span>AI roles</span><b>${S.teams.reduce((n, t) => n + t.roles.length, 0)}</b><small>Across all teams</small></div>
      <div class="stat"><span>Active missions</span><b>${S.teams.reduce((n, t) => n + t.missions.length, 0)}</b><small>Across all teams</small></div>
    </div>
    <div class="tw"><table>
      <thead><tr><th>Team</th><th>Team lead</th><th class="chev"></th></tr></thead>
      <tbody>${S.teams.map((t) => {
        const l = leadOf(t);
        return `<tr class="click ${S.selected === t.id ? "sel" : ""}" tabindex="0" data-action="open" data-id="${t.id}" aria-label="Open ${esc(t.name)}">
          <td class="tname">${esc(t.name)}</td>
          <td><span class="who"><span class="av">${esc(initials(l.name))}</span><span class="who-tx">${esc(l.name)}<small>${plural(t.people.length, "member")}</small></span></span></td>
          <td class="chev" aria-hidden="true">›</td>
        </tr>`;
      }).join("")}</tbody>
    </table></div>`;
  renderPanel();
}

function renderPanel() {
  const t = team(S.selected), panel = $("#panel");
  $("#app").classList.toggle("has-panel", !!t);
  panel.hidden = !t;
  if (!t) return;
  const tabs = [["people", "People"], ["access", "Access"]];
  panel.innerHTML = `
    <div class="p-head"><span class="av lg">${esc(t.name.replace(/^Team\s+/, "").slice(0, 2).toUpperCase())}</span>
      <div><h2>${esc(t.name)}</h2><small>Led by ${esc(leadOf(t).name)} · ${plural(t.people.length, "member")}</small></div>
      <button class="x" data-action="close" aria-label="Close">✕</button></div>
    ${t.about ? `<p class="p-about">${esc(t.about)}</p>` : ""}
    <div class="p-sum">
      <div class="p-stat"><span>AI roles</span><b>${t.roles.length}</b></div>
      <div class="p-stat"><span>Mission health</span><span class="tags">${health(t)}</span></div>
    </div>
    <div class="tabs" role="tablist">${tabs.map(([k, l]) => `<button class="tab ${S.tab === k ? "on" : ""}" role="tab" aria-selected="${S.tab === k}" data-action="tab" data-k="${k}">${l}</button>`).join("")}</div>
    <div class="p-body">${({ people: peopleTab, access: accessTab })[S.tab](t)}</div>`;
}

function peopleTab(t) {
  const lead = leadOf(t);
  const ordered = [lead, ...t.people.filter((p) => p !== lead)];
  return `<button class="btn dashed" data-action="add-person" style="margin-bottom:6px">+ Add person</button>` + ordered.map((p) => {
    const mgr = person(t, p.manager);
    return `<button class="item" data-action="edit-person" data-id="${p.id}">
      <span class="av">${esc(initials(p.name))}</span>
      <span class="tx"><b>${esc(p.name)}</b><small>${esc(p.title)}${mgr ? ` · reports to ${esc(mgr.name)}` : p === lead ? " · team lead" : ""}</small></span>
      <span class="tag">${p.access}</span></button>`;
  }).join("");
}

function accessTab(t) {
  const count = (lvl) => t.people.filter((p) => p.access === lvl).length;
  return `<div class="sum">${Object.keys(ACCESS).map((l) => `<div><span>${l}s</span><b>${count(l)}</b></div>`).join("")}</div>
    ${Object.entries(ACCESS).map(([l, d]) => `<div class="level"><b>${l}</b><small>${d}</small></div>`).join("")}
    <div class="sec-label">People</div>
    <input class="p-search" id="access-search" type="search" placeholder="Search people..." aria-label="Search people" autocomplete="off">
    <p class="muted no-match" id="access-none" hidden>No one matches that search.</p>
    ${t.people.map((p) => `<div class="item" data-search="${esc((label(t, p) + " " + p.access).toLowerCase())}"><span class="av">${esc(initials(p.name))}</span><span class="tx"><b>${esc(p.name)}</b><small>${esc(p.title)}</small></span>
      <select class="inline" data-action="set-access" data-id="${p.id}" aria-label="Access for ${esc(label(t, p))}" ${p.id === t.lead ? "disabled" : ""}>
        ${Object.keys(ACCESS).map((l) => `<option ${p.access === l ? "selected" : ""}>${l}</option>`).join("")}</select></div>`).join("")}`;
}

/* ---------- Modals ---------- */
function modal({ title, intro = "", fields, submit, extra = "", onSubmit }) {
  $("#modal-root").innerHTML = `<div class="scrim" data-action="scrim"><form class="modal" id="mform" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <h2>${esc(title)}</h2>${intro ? `<p class="intro">${intro}</p>` : ""}${fields}
    <span class="err" id="merr" hidden></span>
    <div class="foot">${extra}<button type="button" class="btn" data-action="close-modal">Cancel</button><button class="btn primary" type="submit">${esc(submit)}</button></div>
  </form></div>`;
  const f = $("#mform");
  f.querySelector("input[type=text], select")?.focus();
  f.addEventListener("submit", (e) => {
    e.preventDefault();
    const err = onSubmit(Object.fromEntries(new FormData(f)), f);
    if (err) { const el = $("#merr"); el.textContent = err; el.hidden = false; return; }
    closeModal(); render();
  });
}
const closeModal = () => ($("#modal-root").innerHTML = "");
const accessSelect = (sel = "Member") => `<select id="m-access" name="access">${Object.keys(ACCESS).map((l) => `<option ${l === sel ? "selected" : ""}>${l}</option>`).join("")}</select>`;

const personRow = () => `<div class="p-row"><input type="text" name="person" placeholder="Person name" aria-label="Person name">
  <input type="text" name="ptitle" placeholder="Title" aria-label="Title"><button type="button" class="row-x" data-action="del-row" aria-label="Remove this person">✕</button></div>`;

function createTeam() {
  const next = "Team " + String.fromCharCode(65 + S.teams.length);
  modal({
    title: "Create team", submit: "Create team", intro: "Name the team, say what it's for, and add its people.",
    fields: `<label class="f">Team name<input id="m-tname" name="name" type="text" value="${next}"></label>
      <label class="f">Purpose<textarea id="m-tabout" name="about" rows="2" placeholder="What this team is responsible for"></textarea></label>
      <label class="f">Team lead<input id="m-tlead" name="lead" type="text" value="Person name"></label>
      <div class="f"><span>Add people <small>· they'll report to the team lead</small></span>
        <div id="m-people" class="p-rows">${personRow()}${personRow()}</div>
        <button type="button" class="btn dashed sm" data-action="add-row">+ Add another person</button></div>`,
    onSubmit: (d, f) => {
      const name = d.name.trim(); if (!name) return "Enter a team name.";
      if (S.teams.some((t) => t.name.toLowerCase() === name.toLowerCase())) return "A team with that name already exists.";
      const lead = { id: id(), name: d.lead.trim() || "Person name", title: "Title", manager: null, access: "Admin" };
      const people = [...f.querySelectorAll(".p-row")]
        .map((r) => ({ name: r.querySelector("[name=person]").value.trim(), title: r.querySelector("[name=ptitle]").value.trim() }))
        .filter((r) => r.name)
        .map((r) => ({ id: id(), name: r.name, title: r.title || "Title", manager: lead.id, access: "Member" }));
      const t = { id: "team-" + id(), name, about: d.about.trim(), people: [lead, ...people], lead: lead.id, roles: [], missions: [] };
      S.teams.push(t); S.selected = t.id; S.tab = "people";
      toast(`Created ${name} with ${plural(t.people.length, "member")}`);
    },
  });
}

function addPerson() {
  const t = team(S.selected);
  modal({
    title: `Add person to ${t.name}`, submit: "Add person",
    fields: `<label class="f">Name<input id="m-pname" name="name" type="text" value="Person name"></label>
      <label class="f">Title<input id="m-ptitle" name="title" type="text" value="Title"></label>
      <label class="f">Reports to<select id="m-pmgr" name="manager">${peopleOptions(t, t.lead)}</select></label>
      <label class="f">Access${accessSelect()}</label>`,
    onSubmit: (d) => {
      t.people.push({ id: id(), name: d.name.trim() || "Person name", title: d.title.trim() || "Title", manager: d.manager, access: d.access });
      S.tab = "people"; toast("Person added");
    },
  });
}

function editPerson(pid) {
  const t = team(S.selected), p = person(t, pid), isLead = pid === t.lead;
  const below = (x) => t.people.filter((q) => q.manager === x).flatMap((q) => [q.id, ...below(q.id)]);
  modal({
    title: "Edit person", submit: "Save",
    fields: `<label class="f">Name<input id="m-ename" name="name" type="text" value="${esc(p.name)}"></label>
      <label class="f">Title<input id="m-etitle" name="title" type="text" value="${esc(p.title)}"></label>
      ${isLead ? `<p class="intro">This person leads ${esc(t.name)} and doesn't report to anyone on the team.</p>`
        : `<label class="f">Reports to<select id="m-emgr" name="manager">${peopleOptions(t, p.manager, [pid, ...below(pid)])}</select></label>
      <label class="f">Access${accessSelect(p.access)}</label>`}`,
    extra: isLead ? "" : `<button type="button" class="btn danger left" data-action="remove-person" data-id="${pid}">Remove</button>`,
    onSubmit: (d) => {
      p.name = d.name.trim() || "Person name"; p.title = d.title.trim() || "Title";
      if (!isLead) { p.manager = d.manager; p.access = d.access; }
      toast("Saved");
    },
  });
}

/* ---------- Events ---------- */
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-action]");
  if (!el) return;
  const { action: a, id: tid } = el.dataset;
  switch (a) {
    case "open": S.selected = tid; S.tab = "people"; render(); break;
    case "close": S.selected = null; render(); break;
    case "tab": S.tab = el.dataset.k; renderPanel(); break;
    case "create-team": createTeam(); break;
    case "add-person": addPerson(); break;
    case "edit-person": editPerson(tid); break;
    case "remove-person": {
      const t = team(S.selected), p = person(t, tid);
      t.people.filter((q) => q.manager === tid).forEach((q) => (q.manager = p.manager));
      t.people = t.people.filter((q) => q.id !== tid);
      closeModal(); render(); toast("Person removed"); break;
    }
    case "add-row": { $("#m-people").insertAdjacentHTML("beforeend", personRow()); const rows = $("#m-people").querySelectorAll(".p-row"); rows[rows.length - 1].querySelector("input").focus(); break; }
    case "del-row": el.closest(".p-row").remove(); break;
    case "close-modal": closeModal(); break;
    case "scrim": if (e.target === el) closeModal(); break;
  }
});

document.addEventListener("input", (e) => {
  if (e.target.id !== "access-search") return;
  const q = e.target.value.trim().toLowerCase();
  let shown = 0;
  document.querySelectorAll(".p-body [data-search]").forEach((el) => { el.hidden = !!q && !el.dataset.search.includes(q); if (!el.hidden) shown++; });
  $("#access-none").hidden = shown > 0;
});

document.addEventListener("change", (e) => {
  const el = e.target;
  if (el.dataset.action === "set-access") { const t = team(S.selected); person(t, el.dataset.id).access = el.value; render(); toast("Access updated"); }
});

document.addEventListener("keydown", (e) => {
  const row = e.target.closest?.("tr.click");
  if (row && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); row.click(); }
  if (e.key === "Escape") {
    if ($("#modal-root").innerHTML) closeModal();
    else if (S.selected) { S.selected = null; render(); }
  }
});

Shell.mount("team");
render();
</script>
</body>
</html>
