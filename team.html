<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flownt My Team</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231a1a1f'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;800&display=swap">
<link rel="stylesheet" href="shell.css">
<style>
/* My Team: team list | selected team (mission, people and the AI roles they look after) | person access panel.
   Shared tokens and shell live in shell.css. */
.app.has-panel { grid-template-columns: 248px minmax(0, 1fr) 400px; }
.content { padding-top: 6px; }
.btn.dashed { border-style: dashed; }
.btn.danger { color: var(--bad); }
.btn.sm { padding: 6px 11px; font-size: 13px; }
.muted { color: var(--muted); }

.stats { display: flex; gap: 12px; margin-bottom: 24px; }
.stat { width: 136px; max-width: 100%; aspect-ratio: 1; flex: 0 1 136px; min-width: 0; border: 1.5px solid var(--line-soft); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; }
.stat span { display: block; font-size: 13px; font-weight: 600; color: var(--muted); min-height: 2.6em; }
.stat b { display: block; margin-top: 6px; font-size: 30px; font-weight: 800; line-height: 1.25; font-variant-numeric: tabular-nums; }
.stat small { margin-top: auto; line-height: 1.3; color: var(--muted); font-size: 13px; }

/* List and detail */
.split { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 20px; align-items: start; }
.teams { display: flex; flex-direction: column; gap: 8px; position: sticky; top: 0; }
.search { border: 1.5px solid var(--line); border-radius: 8px; padding: 9px 12px; background: var(--bg); width: 100%; }
.search:focus { border-color: var(--accent); outline: none; }
.team-list { border: 1.5px solid var(--line-soft); border-radius: var(--r); overflow: hidden; }
.team-btn { display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; padding: 11px 14px; border-bottom: 1px solid var(--line-soft); }
.team-btn:last-child { border-bottom: 0; }
.team-btn:hover { background: var(--sunk); }
.team-btn b { display: block; font-weight: 800; }
.team-btn small { color: var(--muted); font-size: 13px; }
.team-btn.on { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
.team-btn .chev { color: var(--muted); }
.no-match { font-size: 14px; padding: 12px 14px; color: var(--muted); }

.detail { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.t-head { display: flex; align-items: center; gap: 12px; }
.t-head h2 { font-size: 22px; font-weight: 800; }
.t-head small { color: var(--muted); font-size: 14px; }
.t-about { color: var(--muted); font-size: 14px; margin-top: -6px; }
.av { width: 30px; height: 30px; border-radius: 50%; background: var(--chip); display: inline-grid; place-items: center; font-weight: 800; font-size: 11px; flex: none; }
.av.lg { width: 44px; height: 44px; font-size: 15px; }

.mission { display: flex; align-items: center; gap: 12px; background: var(--accent); color: var(--accent-ink); border-radius: 12px; padding: 12px 16px; }
.mission .flag { width: 32px; height: 32px; border-radius: 8px; background: rgba(255,255,255,.2); display: grid; place-items: center; flex: none; }
.mission small { display: block; font-size: 11px; font-weight: 700; letter-spacing: .06em; opacity: .85; }
.mission b { font-size: 17px; font-weight: 800; }

.sec-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.sec-row h3 { font-size: 16px; font-weight: 800; }

.tw { border: 1.5px solid var(--line-soft); border-radius: var(--r); overflow-x: auto; }
table { border-collapse: collapse; width: 100%; }
th, td { text-align: left; padding: 12px 14px; border-bottom: 1px solid var(--line-soft); vertical-align: middle; font-size: 14px; }
th { font-size: 12px; font-weight: 700; color: var(--muted); background: var(--sunk); white-space: nowrap; }
tbody tr:last-child td { border-bottom: 0; }
tr.click { cursor: pointer; }
tr.click:hover td { background: var(--sunk); }
tr.click:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
tr.sel td { background: var(--accent-soft); }
tr.sel td:first-child { box-shadow: inset 3px 0 0 var(--accent); }
.who { display: flex; align-items: center; gap: 10px; min-width: 0; white-space: nowrap; }
.who b { display: block; font-weight: 700; }
.who small { display: block; color: var(--muted); font-size: 13px; }
.chev { color: var(--muted); text-align: right; width: 28px; }
.roles { display: flex; flex-wrap: wrap; gap: 6px; }
.ai { display: inline-flex; align-items: center; gap: 6px; border: 1.5px dashed var(--accent); border-radius: 8px; padding: 4px 9px 4px 5px; font-size: 13px; font-weight: 600; white-space: nowrap; }
.ai i { width: 20px; height: 20px; border-radius: 5px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-style: normal; font-weight: 800; font-size: 9px; }
.tag { display: inline-flex; align-items: center; border-radius: 6px; padding: 2px 8px; font-size: 12px; font-weight: 700; white-space: nowrap; background: var(--chip); }
.more { font-size: 13px; color: var(--muted); }
.link { font-weight: 600; text-decoration: underline; text-underline-offset: 2px; color: var(--ink); }

/* Person access panel */
.panel { border-left: 1px solid var(--line-soft); display: flex; flex-direction: column; min-width: 0; background: var(--bg); overflow-y: auto; padding: 22px; gap: 14px; }
.p-head { display: flex; align-items: center; gap: 12px; }
.p-head h2 { font-size: 19px; font-weight: 800; }
.p-head small { color: var(--muted); font-size: 14px; }
.p-head .x { margin-left: auto; width: 38px; height: 38px; border: 1.5px solid var(--line); border-radius: 8px; font-size: 17px; flex: none; display: grid; place-items: center; }
.panel h3 { font-size: 16px; font-weight: 800; margin-top: 4px; }
.level { display: flex; gap: 12px; align-items: flex-start; border: 1.5px solid var(--line-soft); border-radius: 10px; padding: 12px 14px; width: 100%; }
.level:hover:not(:disabled) { border-color: var(--accent); }
.level.on { border-color: var(--accent); background: var(--accent-soft); }
.level:disabled { cursor: default; opacity: .6; }
.level .dot { width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid var(--line); flex: none; margin-top: 2px; }
.level.on .dot { border-color: var(--accent); background: var(--accent); box-shadow: inset 0 0 0 3px var(--bg); }
.level b { display: block; }
.level small { color: var(--muted); font-size: 13px; }
.p-note { color: var(--muted); font-size: 13px; }
.p-foot { margin-top: auto; padding-top: 8px; }

/* Modals */
.scrim { position: fixed; inset: 0; background: var(--scrim); display: grid; place-items: center; z-index: 60; padding: 16px; grid-template-columns: minmax(0, 1fr); }
.modal { background: var(--bg); border-radius: 14px; width: 460px; max-width: 100%; padding: 24px; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 20px 60px rgba(0,0,0,.25); max-height: 90vh; overflow-y: auto; justify-self: center; }
.modal h2 { font-size: 20px; font-weight: 800; }
.modal .intro { color: var(--muted); font-size: 14px; }
.modal label.f { display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600; }
.modal div.f { display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
.modal div.f > span { font-weight: 600; }
.modal .f small { font-weight: 400; color: var(--muted); }
.modal input[type=text], .modal select, .modal textarea { border: 1.5px solid var(--line); border-radius: 8px; padding: 10px 12px; background: var(--bg); font-weight: 400; width: 100%; }
.modal textarea { resize: vertical; font: inherit; }
.modal .err { color: var(--bad); font-weight: 600; font-size: 13px; }
.modal .foot { display: flex; justify-content: flex-end; gap: 10px; flex-wrap: wrap; }
.modal .foot .left { margin-right: auto; }

/* Responsive */
@media (max-width: 1180px) {
  .app.has-panel { grid-template-columns: 248px minmax(0, 1fr); }
  .panel { position: fixed; top: 0; right: 0; bottom: 0; width: min(420px, 100vw); z-index: 50; box-shadow: -10px 0 40px rgba(0,0,0,.18);
    padding-top: calc(22px + env(safe-area-inset-top, 0px)); padding-bottom: calc(22px + env(safe-area-inset-bottom, 0px)); padding-right: max(22px, env(safe-area-inset-right, 0px)); }
}
@media (max-width: 860px) {
  .app.has-panel { grid-template-columns: minmax(0, 1fr); }
  .content { padding-top: 10px; }
  .stat { padding: 12px; }
  .stat span { min-height: 2.6em; }
  .split { grid-template-columns: minmax(0, 1fr); }
  .teams { position: static; }

  /* People table becomes stacked rows */
  thead { display: none; }
  table, tbody, tr, td { display: block; }
  tr { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 12px; padding: 12px 14px; border-bottom: 1px solid var(--line-soft); }
  tbody tr:last-child { border-bottom: 0; }
  td { padding: 0; border: 0; grid-column: 1; }
  td.chev { grid-column: 2; grid-row: 1 / span 3; align-self: center; }
  tr.click:hover td, tr.sel td { background: none; }
  tr.sel { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
  tr.sel td:first-child { box-shadow: none; }
}
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="sidebar" id="sidebar"></aside>

  <div class="main">
    <header class="topbar" id="topbar"></header>
    <main class="content" id="content"></main>
  </div>

  <aside class="panel" id="panel" hidden></aside>
</div>
<div id="modal-root"></div>
<div class="toast" id="toast" hidden></div>

<script src="shell.js"></script>
<script>
const ACCESS = {
  Admin: "Manages the team, its people, AI roles and access.",
  Captain: "Leads their reports and approves AI role work.",
  Member: "Works on missions and uses the team's AI roles.",
};
const SHOWN = 5;   // people shown before "Show all"

let uid = 1;
const id = () => "x" + uid++;
// roleSplit gives how many AI roles each of the first people looks after.
function makeTeam(letter, size, roleSplit, missions) {
  const people = [];
  const lead = { id: id(), name: "Person name", title: "Title", manager: null, access: "Admin" };
  people.push(lead);
  const mgrs = [];
  for (let i = 1; i < size; i++) {
    const isMgr = i <= 2 && size > 6;
    const p = { id: id(), name: "Person name", title: "Title", manager: isMgr || !mgrs.length ? lead.id : mgrs[i % mgrs.length].id, access: isMgr ? "Captain" : "Member" };
    if (isMgr) mgrs.push(p);
    people.push(p);
  }
  let n = 0;
  const roles = roleSplit.flatMap((count, i) => Array.from({ length: count }, () => ({ id: id(), name: "AI role " + ++n, owner: people[i].id })));
  return {
    id: "team-" + letter.toLowerCase(), name: "Team " + letter, about: "Team purpose goes here.", mission: "Mission title",
    people, lead: lead.id, roles, missions: missions.map((status) => ({ id: id(), status })),
  };
}
const S = {
  teams: [
    makeTeam("A", 12, [2, 1, 3], ["good", "good", "warn", "bad"]),
    makeTeam("B", 6, [1, 1], ["good", "good", "warn"]),
    makeTeam("C", 8, [0, 2], ["good", "warn", "bad"]),
  ],
  selected: "team-a",
  person: null,
  showAll: false,
  query: "",
};

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const initials = (n) => n.trim().split(/\s+/).map((w) => w[0]).slice(0, 2).join("").toUpperCase() || "?";
const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;
const team = (tid) => S.teams.find((t) => t.id === tid);
const person = (t, pid) => t.people.find((p) => p.id === pid);
const leadOf = (t) => person(t, t.lead);
const rolesOf = (t, pid) => t.roles.filter((r) => r.owner === pid);
// Placeholder names repeat, so pickers number people in list order.
const label = (t, p) => `${p.name} ${t.people.indexOf(p) + 1}${p.title ? " · " + p.title : ""}`;
const peopleOptions = (t, sel, exclude = []) => t.people.filter((p) => !exclude.includes(p.id))
  .map((p) => `<option value="${p.id}" ${p.id === sel ? "selected" : ""}>${esc(label(t, p))}</option>`).join("");
const toast = Shell.toast;

/* ---------- Render ---------- */
function render() {
  $("#content").innerHTML = `
    <div class="stats">
      <div class="stat"><span>Needs You</span><b>3</b><small>Awaiting your input</small></div>
      <div class="stat"><span>My Active Missions</span><b>4</b><small>Missions you're involved in</small></div>
      <div class="stat"><span>AI Roles I Look After</span><b>2</b><small>Roles you're responsible for</small></div>
    </div>
    <div class="split">
      <div class="teams">
        <input class="search" id="team-search" type="search" placeholder="Search teams..." aria-label="Search teams" autocomplete="off" value="${esc(S.query)}">
        <div class="team-list" id="team-list"></div>
      </div>
      <div class="detail" id="detail"></div>
    </div>`;
  renderList();
  renderDetail();
  renderPanel();
}

function renderList() {
  const q = S.query.trim().toLowerCase();
  const shown = S.teams.filter((t) => t.name.toLowerCase().includes(q));
  $("#team-list").innerHTML = shown.length ? shown.map((t) => `
    <button class="team-btn ${S.selected === t.id ? "on" : ""}" data-action="open" data-id="${t.id}" aria-pressed="${S.selected === t.id}">
      <span><b>${esc(t.name)}</b><small>${plural(t.people.length, "member")}</small></span><span class="chev" aria-hidden="true">›</span>
    </button>`).join("") : `<p class="no-match">No teams match that search.</p>`;
}

function renderDetail() {
  const t = team(S.selected);
  const lead = leadOf(t);
  const ordered = [lead, ...t.people.filter((p) => p !== lead)];
  const visible = S.showAll ? ordered : ordered.slice(0, SHOWN);
  $("#detail").innerHTML = `
    <div class="t-head"><span class="av lg">${esc(t.name.replace(/^Team\s+/, "").slice(0, 2).toUpperCase())}</span>
      <div><h2>${esc(t.name)}</h2><small>Led by ${esc(lead.name)} · ${plural(t.people.length, "member")}</small></div></div>
    ${t.about ? `<p class="t-about">${esc(t.about)}</p>` : ""}
    <div class="mission"><span class="flag" aria-hidden="true">⚑</span><div><small>MISSION</small><b>${esc(t.mission)}</b></div></div>
    <div class="sec-row"><h3>People</h3><button class="btn dashed sm" data-action="add-person">+ Add person</button></div>
    <div class="tw"><table>
      <thead><tr><th>Person</th><th>AI roles they look after</th><th>Access</th><th class="chev"></th></tr></thead>
      <tbody>${visible.map((p) => {
        const roles = rolesOf(t, p.id);
        return `<tr class="click ${S.person === p.id ? "sel" : ""}" tabindex="0" data-action="person" data-id="${p.id}" aria-label="Open access for ${esc(label(t, p))}">
          <td><span class="who"><span class="av">${esc(initials(p.name))}</span><span><b>${esc(p.name)}</b><small>${esc(p.title)}${p === lead ? " · team lead" : ""}</small></span></span></td>
          <td>${roles.length ? `<span class="roles">${roles.map((r) => `<span class="ai"><i>AI</i>${esc(r.name)}</span>`).join("")}</span>` : `<span class="muted">—</span>`}</td>
          <td><span class="tag">${p.access}</span></td>
          <td class="chev" aria-hidden="true">›</td>
        </tr>`;
      }).join("")}</tbody>
    </table></div>
    ${ordered.length > SHOWN ? `<p class="more">${S.showAll ? `Showing all ${ordered.length} people` : `Showing ${SHOWN} of ${ordered.length} people`} ·
      <button class="link" data-action="toggle-all">${S.showAll ? "Show fewer" : "Show all"}</button></p>` : ""}`;
}

function renderPanel() {
  const t = team(S.selected), p = S.person && person(t, S.person), panel = $("#panel");
  $("#app").classList.toggle("has-panel", !!p);
  panel.hidden = !p;
  if (!p) return;
  const isLead = p.id === t.lead;
  panel.innerHTML = `
    <div class="p-head"><span class="av lg">${esc(initials(p.name))}</span>
      <div><h2>${esc(p.name)}</h2><small>${esc(p.title)} · ${esc(t.name)}</small></div>
      <button class="x" data-action="close" aria-label="Close">✕</button></div>
    <h3>Access</h3>
    ${Object.entries(ACCESS).map(([l, d]) => `<button class="level ${p.access === l ? "on" : ""}" data-action="set-access" data-level="${l}" aria-pressed="${p.access === l}" ${isLead ? "disabled" : ""}>
      <span class="dot" aria-hidden="true"></span><span><b>${l}</b><small>${d}</small></span></button>`).join("")}
    ${isLead ? `<p class="p-note">The team lead is always an Admin.</p>` : ""}
    <div class="p-foot"><button class="btn" data-action="edit-person" data-id="${p.id}">Edit person</button></div>`;
}

/* ---------- Modals ---------- */
function modal({ title, intro = "", fields, submit, extra = "", onSubmit }) {
  $("#modal-root").innerHTML = `<div class="scrim" data-action="scrim"><form class="modal" id="mform" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <h2>${esc(title)}</h2>${intro ? `<p class="intro">${intro}</p>` : ""}${fields}
    <span class="err" id="merr" hidden></span>
    <div class="foot">${extra}<button type="button" class="btn" data-action="close-modal">Cancel</button><button class="btn primary" type="submit">${esc(submit)}</button></div>
  </form></div>`;
  const f = $("#mform");
  f.querySelector("input[type=text], select")?.focus();
  f.addEventListener("submit", (e) => {
    e.preventDefault();
    const err = onSubmit(Object.fromEntries(new FormData(f)), f);
    if (err) { const el = $("#merr"); el.textContent = err; el.hidden = false; return; }
    closeModal(); render();
  });
}
const closeModal = () => ($("#modal-root").innerHTML = "");
const accessSelect = (sel = "Member") => `<select id="m-access" name="access">${Object.keys(ACCESS).map((l) => `<option ${l === sel ? "selected" : ""}>${l}</option>`).join("")}</select>`;

function addPerson() {
  const t = team(S.selected);
  modal({
    title: `Add person to ${t.name}`, submit: "Add person",
    fields: `<label class="f">Name<input id="m-pname" name="name" type="text" value="Person name"></label>
      <label class="f">Title<input id="m-ptitle" name="title" type="text" value="Title"></label>
      <label class="f">Reports to<select id="m-pmgr" name="manager">${peopleOptions(t, t.lead)}</select></label>
      <label class="f">Access${accessSelect()}</label>`,
    onSubmit: (d) => {
      t.people.push({ id: id(), name: d.name.trim() || "Person name", title: d.title.trim() || "Title", manager: d.manager, access: d.access });
      S.showAll = true; toast("Person added");
    },
  });
}

function editPerson(pid) {
  const t = team(S.selected), p = person(t, pid), isLead = pid === t.lead;
  const below = (x) => t.people.filter((q) => q.manager === x).flatMap((q) => [q.id, ...below(q.id)]);
  modal({
    title: "Edit person", submit: "Save",
    fields: `<label class="f">Name<input id="m-ename" name="name" type="text" value="${esc(p.name)}"></label>
      <label class="f">Title<input id="m-etitle" name="title" type="text" value="${esc(p.title)}"></label>
      ${isLead ? `<p class="intro">This person leads ${esc(t.name)} and doesn't report to anyone on the team.</p>`
        : `<label class="f">Reports to<select id="m-emgr" name="manager">${peopleOptions(t, p.manager, [pid, ...below(pid)])}</select></label>`}`,
    extra: isLead ? "" : `<button type="button" class="btn danger left" data-action="remove-person" data-id="${pid}">Remove</button>`,
    onSubmit: (d) => {
      p.name = d.name.trim() || "Person name"; p.title = d.title.trim() || "Title";
      if (!isLead) p.manager = d.manager;
      toast("Saved");
    },
  });
}

/* ---------- Events ---------- */
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-action]");
  if (!el) return;
  const { action: a, id: tid } = el.dataset;
  switch (a) {
    case "open": S.selected = tid; S.person = null; S.showAll = false; renderList(); renderDetail(); renderPanel(); break;
    case "person": S.person = tid; renderDetail(); renderPanel(); break;
    case "close": S.person = null; renderDetail(); renderPanel(); break;
    case "toggle-all": S.showAll = !S.showAll; renderDetail(); break;
    case "set-access": {
      const p = person(team(S.selected), S.person);
      if (p.access !== el.dataset.level) { p.access = el.dataset.level; renderDetail(); renderPanel(); toast(`Access set to ${p.access}`); }
      break;
    }
    case "add-person": addPerson(); break;
    case "edit-person": editPerson(tid); break;
    case "remove-person": {
      const t = team(S.selected), p = person(t, tid);
      t.people.filter((q) => q.manager === tid).forEach((q) => (q.manager = p.manager));
      t.roles.forEach((r) => r.owner === tid && (r.owner = t.lead));
      t.people = t.people.filter((q) => q.id !== tid);
      S.person = null; closeModal(); render(); toast("Person removed"); break;
    }
    case "close-modal": closeModal(); break;
    case "scrim": if (e.target === el) closeModal(); break;
  }
});

document.addEventListener("input", (e) => {
  if (e.target.id === "team-search") { S.query = e.target.value; renderList(); }
});

document.addEventListener("keydown", (e) => {
  const row = e.target.closest?.("tr.click");
  if (row && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); row.click(); }
  if (e.key === "Escape") {
    if ($("#modal-root").innerHTML) closeModal();
    else if (S.person) { S.person = null; renderDetail(); renderPanel(); }
  }
});

Shell.mount("team", { title: "My Team" });
render();
</script>
</body>
</html>
