<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flownt AI Role Activity</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231a1a1f'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;800&display=swap">
<link rel="stylesheet" href="shell.css">
<style>
/* AI Role Activity: status filters, activity feed | activity detail panel. Shared tokens and shell live in shell.css. */
.app.has-panel { grid-template-columns: 248px minmax(0, 1fr) 420px; }
.content { padding-top: 6px; }
.muted { color: var(--muted); }

.scope { color: var(--muted); font-size: 15px; margin-bottom: 10px; }
.filters { display: flex; gap: 4px; flex-wrap: wrap; border-bottom: 1.5px solid var(--line-soft); margin-bottom: 16px; }
.filter { padding: 10px 14px; font-weight: 600; color: var(--muted); border-bottom: 3px solid transparent; margin-bottom: -1.5px; white-space: nowrap; }
.filter.on { color: var(--accent); font-weight: 800; border-color: var(--accent); }
.filter .n { font-size: 12px; background: var(--chip); color: var(--ink); border-radius: 99px; padding: 1px 7px; margin-left: 5px; font-weight: 700; }

.tw { border: 1.5px solid var(--line-soft); border-radius: var(--r); overflow-x: auto; }
table { border-collapse: collapse; width: 100%; }
th, td { text-align: left; padding: 13px 16px; border-bottom: 1px solid var(--line-soft); vertical-align: middle; font-size: 14px; }
th { font-size: 12px; font-weight: 700; color: var(--muted); background: var(--sunk); white-space: nowrap; }
tbody tr:last-child td { border-bottom: 0; }
tr.click { cursor: pointer; }
tr.click:hover td { background: var(--sunk); }
tr.click:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
tr.sel td { background: var(--accent-soft); }
tr.sel td:first-child { box-shadow: inset 3px 0 0 var(--accent); }
.role { display: inline-flex; align-items: center; gap: 7px; font-weight: 700; white-space: nowrap; }
.role i { width: 22px; height: 22px; border-radius: 6px; background: var(--accent-soft); color: var(--accent); border: 1.5px dashed var(--accent); display: grid; place-items: center; font-style: normal; font-weight: 800; font-size: 9px; flex: none; }
td.when { color: var(--muted); white-space: nowrap; }
.chev { color: var(--muted); text-align: right; width: 28px; }
.status { display: inline-flex; align-items: center; gap: 6px; border-radius: 6px; padding: 2px 8px; font-size: 12px; font-weight: 700; white-space: nowrap; }
.status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.status.progress { color: var(--accent); background: var(--accent-soft); }
.status.input { color: var(--warn); background: var(--warn-bg); }
.status.done { color: var(--good); background: var(--good-bg); }
.empty { padding: 18px 16px; color: var(--muted); font-size: 14px; }

/* Activity detail */
.panel { border-left: 1px solid var(--line-soft); display: flex; flex-direction: column; gap: 18px; min-width: 0; background: var(--bg); overflow-y: auto; padding: 22px; }
.p-head { display: flex; align-items: flex-start; gap: 12px; }
.p-head h2 { font-size: 19px; font-weight: 800; margin-bottom: 4px; }
.p-head .x { margin-left: auto; width: 38px; height: 38px; border: 1.5px solid var(--line); border-radius: 8px; font-size: 17px; flex: none; display: grid; place-items: center; }
.sec { display: flex; flex-direction: column; gap: 8px; }
.sec h3 { font-size: 13px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.sec p { font-size: 14px; }
.kv { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; padding: 8px 0; border-bottom: 1px solid var(--line-soft); }
.kv:last-child { border-bottom: 0; }
.kv span:first-child { color: var(--muted); }
.kv span:last-child { font-weight: 600; text-align: right; }
.output { background: var(--sunk); border: 1.5px solid var(--line-soft); border-radius: 10px; padding: 12px 14px; font-size: 14px; }
.steps { display: flex; flex-direction: column; gap: 8px; margin: 0; padding: 0; list-style: none; }
.steps li { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; }
.steps li::before { content: "✓"; width: 20px; height: 20px; border-radius: 50%; background: var(--good-bg); color: var(--good); display: grid; place-items: center; font-size: 11px; font-weight: 800; flex: none; }
.input-box { border-radius: 10px; padding: 12px 14px; font-size: 14px; }
.input-box.yes { background: var(--warn-bg); color: var(--warn); font-weight: 600; }
.input-box.no { background: var(--sunk); color: var(--muted); }

@media (max-width: 1180px) {
  .app.has-panel { grid-template-columns: 248px minmax(0, 1fr); }
  .panel { position: fixed; top: 0; right: 0; bottom: 0; width: min(440px, 100vw); z-index: 50; box-shadow: -10px 0 40px rgba(0,0,0,.18);
    padding-top: calc(22px + env(safe-area-inset-top, 0px)); padding-bottom: calc(22px + env(safe-area-inset-bottom, 0px)); padding-right: max(22px, env(safe-area-inset-right, 0px)); }
}
@media (max-width: 860px) {
  .app.has-panel { grid-template-columns: minmax(0, 1fr); }
  .content { padding-top: 10px; }
  .filters { flex-wrap: nowrap; overflow-x: auto; }
  thead { display: none; }
  table, tbody, tr, td { display: block; }
  tr { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 12px; padding: 12px 14px; border-bottom: 1px solid var(--line-soft); }
  tbody tr:last-child { border-bottom: 0; }
  td { padding: 0; border: 0; grid-column: 1; }
  td.chev { grid-column: 2; grid-row: 1 / span 5; align-self: center; }
  td[data-label]::before { content: attr(data-label) ": "; color: var(--muted); }
  tr.click:hover td, tr.sel td { background: none; }
  tr.sel { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
  tr.sel td:first-child { box-shadow: none; }
}
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <main class="content" id="content"></main>
  </div>
  <aside class="panel" id="panel" hidden></aside>
</div>
<div class="toast" id="toast" hidden></div>

<script src="shell.js"></script>
<script>
const STATUS = { progress: "In progress", input: "Needs your input", done: "Completed" };
const FILTERS = [["all", "All activity"], ["progress", "In progress"], ["input", "Needs your input"], ["done", "Completed"]];
// Activity from every mission the person's AI roles are involved in, newest first.
const M1 = "Research competitors for the product launch", M2 = "Mission title 2", M3 = "Mission title 3";
const steps = (n) => Array.from({ length: n }, () => "Step completed goes here.");
const ACTIVITY = [
  { id: "a1", role: "Research Analyst", mission: M1, activity: "Analysing competitor pricing and features", status: "progress", updated: "5 minutes ago", output: "Output goes here.", done: steps(2), question: "" },
  { id: "a2", role: "Data Analyst", mission: M2, activity: "Needs clarification on sales data", status: "input", updated: "12 minutes ago", output: "Output goes here.", done: steps(1), question: "Needs clarification on sales data" },
  { id: "a3", role: "Content Writer", mission: M3, activity: "Activity description goes here.", status: "progress", updated: "30 minutes ago", output: "Output goes here.", done: steps(2), question: "" },
  { id: "a4", role: "Content Writer", mission: M1, activity: "Drafted the campaign brief", status: "done", updated: "1 hour ago", output: "Output goes here.", done: steps(3), question: "" },
  { id: "a5", role: "Research Analyst", mission: M2, activity: "Activity description goes here.", status: "done", updated: "2 hours ago", output: "Output goes here.", done: steps(3), question: "" },
  { id: "a6", role: "Data Analyst", mission: M3, activity: "Activity description goes here.", status: "input", updated: "3 hours ago", output: "Output goes here.", done: steps(1), question: "Question for you goes here." },
];
const S = { filter: "all", open: null };
const $ = (s) => document.querySelector(s);
const esc = Shell.esc;
const statusTag = (s) => `<span class="status ${s}">${STATUS[s]}</span>`;

function render() {
  $("#content").innerHTML = `
    <p class="scope">Your ${new Set(ACTIVITY.map((a) => a.role)).size} AI roles across ${new Set(ACTIVITY.map((a) => a.mission)).size} missions</p>
    <div class="filters" role="tablist">${FILTERS.map(([k, l]) => {
      const n = k === "all" ? ACTIVITY.length : ACTIVITY.filter((a) => a.status === k).length;
      return `<button class="filter ${S.filter === k ? "on" : ""}" role="tab" aria-selected="${S.filter === k}" data-action="filter" data-k="${k}">${l}<span class="n">${n}</span></button>`;
    }).join("")}</div>
    <div class="tw" id="feed"></div>`;
  renderFeed();
  renderPanel();
}

function renderFeed() {
  const rows = ACTIVITY.filter((a) => S.filter === "all" || a.status === S.filter);
  $("#feed").innerHTML = `<table>
    <thead><tr><th>AI role</th><th>Mission</th><th>Current activity</th><th>Status</th><th>Last updated</th><th class="chev"></th></tr></thead>
    <tbody>${rows.map((a) => `<tr class="click ${S.open === a.id ? "sel" : ""}" tabindex="0" data-action="open" data-id="${a.id}" aria-label="Open ${esc(a.role)} activity">
      <td><span class="role"><i>AI</i>${esc(a.role)}</span></td>
      <td data-label="Mission">${esc(a.mission)}</td>
      <td data-label="Current activity">${esc(a.activity)}</td>
      <td>${statusTag(a.status)}</td>
      <td class="when" data-label="Last updated">${esc(a.updated)}</td>
      <td class="chev" aria-hidden="true">›</td></tr>`).join("")}</tbody></table>
    ${rows.length ? "" : `<p class="empty">No activity here right now.</p>`}`;
}

function renderPanel() {
  const a = ACTIVITY.find((x) => x.id === S.open), panel = $("#panel");
  $("#app").classList.toggle("has-panel", !!a);
  panel.hidden = !a;
  if (!a) return;
  panel.innerHTML = `
    <div class="p-head"><div><h2>${esc(a.role)}</h2>${statusTag(a.status)}</div><button class="x" data-action="close" aria-label="Close">✕</button></div>
    <div class="sec"><div>
      <div class="kv"><span>Mission</span><span>${esc(a.mission)}</span></div>
      <div class="kv"><span>Current activity</span><span>${esc(a.activity)}</span></div>
      <div class="kv"><span>Last updated</span><span>${esc(a.updated)}</span></div></div></div>
    <div class="sec"><h3>Output</h3><div class="output">${esc(a.output)}</div></div>
    <div class="sec"><h3>What it has done so far</h3><ul class="steps">${a.done.map((d) => `<li>${esc(d)}</li>`).join("")}</ul></div>
    <div class="sec"><h3>Needs human input</h3>${a.question ? `<div class="input-box yes">Yes · ${esc(a.question)}</div>` : `<div class="input-box no">No input needed</div>`}</div>`;
}

document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-action]");
  if (!el) return;
  if (el.dataset.action === "filter") { S.filter = el.dataset.k; render(); }
  if (el.dataset.action === "open") { S.open = el.dataset.id; renderFeed(); renderPanel(); }
  if (el.dataset.action === "close") { S.open = null; renderFeed(); renderPanel(); }
});
document.addEventListener("keydown", (e) => {
  const row = e.target.closest?.("tr.click");
  if (row && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); row.click(); }
  if (e.key === "Escape" && S.open) { S.open = null; renderFeed(); renderPanel(); }
});

Shell.mount("team", { title: "AI Role Activity", needs: false });
render();
</script>
</body>
</html>
