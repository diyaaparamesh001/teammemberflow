<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flownt AI Workforce</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231a1a1f'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;800&display=swap">
<link rel="stylesheet" href="shell.css">
<style>
/* AI Workforce: count squares + Create AI role, filters, AI role table | role detail panel.
   Shared tokens and shell live in shell.css. */
.app.has-panel { grid-template-columns: 248px minmax(0, 1fr) 420px; }
.content { padding-top: 6px; }
.muted { color: var(--muted); }

.top-row { display: flex; align-items: flex-start; gap: 12px; flex-wrap: wrap; margin-bottom: 22px; }
.stat { width: 136px; aspect-ratio: 1; flex: 0 1 136px; min-width: 0; border: 1.5px solid var(--line-soft); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; }
.stat span { font-size: 13px; font-weight: 600; color: var(--muted); }
.stat b { margin-top: auto; font-size: 30px; font-weight: 800; line-height: 1.2; font-variant-numeric: tabular-nums; }
.top-row .btn.primary { align-self: flex-start; }

.filters { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.filters label { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; color: var(--muted); }
.filters select { border: 1.5px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--bg); font-weight: 400; color: var(--ink); }

.tw { border: 1.5px solid var(--line-soft); border-radius: var(--r); overflow-x: auto; }
table { border-collapse: collapse; width: 100%; }
th, td { text-align: left; padding: 13px 16px; border-bottom: 1px solid var(--line-soft); vertical-align: middle; font-size: 14px; }
th { font-size: 12px; font-weight: 700; color: var(--muted); background: var(--sunk); white-space: nowrap; }
tbody tr:last-child td { border-bottom: 0; }
tr.click { cursor: pointer; }
tr.click:hover td { background: var(--sunk); }
tr.click:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
tr.sel td { background: var(--accent-soft); }
tr.sel td:first-child { box-shadow: inset 3px 0 0 var(--accent); }
td.name { font-weight: 700; white-space: nowrap; }
.chev { color: var(--muted); text-align: right; width: 28px; }
.status { display: inline-flex; align-items: center; gap: 6px; border-radius: 6px; padding: 2px 8px; font-size: 12px; font-weight: 700; white-space: nowrap; }
.status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.status.active { color: var(--good); background: var(--good-bg); }
.status.inactive { color: var(--muted); background: var(--chip); }
.empty { padding: 18px 16px; color: var(--muted); font-size: 14px; }

/* Role detail panel */
.panel { border-left: 1px solid var(--line-soft); display: flex; flex-direction: column; gap: 18px; min-width: 0; background: var(--bg); overflow-y: auto; padding: 22px; }
.p-head { display: flex; align-items: center; gap: 12px; }
.p-head .ic { width: 44px; height: 44px; border-radius: 10px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-weight: 800; font-size: 13px; flex: none; border: 1.5px dashed var(--accent); }
.p-head h2 { font-size: 19px; font-weight: 800; }
.p-head .x { margin-left: auto; width: 38px; height: 38px; border: 1.5px solid var(--line); border-radius: 8px; font-size: 17px; flex: none; display: grid; place-items: center; }
.sec h3 { font-size: 13px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
.sec p { font-size: 14px; white-space: pre-wrap; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1.5px solid var(--line-soft); border-radius: 7px; padding: 4px 10px; font-size: 13px; font-weight: 600; }
.who { display: flex; align-items: center; gap: 10px; }
.av { width: 30px; height: 30px; border-radius: 50%; background: var(--chip); display: inline-grid; place-items: center; font-weight: 800; font-size: 11px; flex: none; }
.missions { display: flex; flex-direction: column; gap: 6px; }
.mission { display: flex; align-items: center; gap: 8px; border-radius: 8px; padding: 8px 12px; background: var(--accent-soft); color: var(--accent); font-weight: 700; font-size: 14px; }
.p-foot { margin-top: auto; }

/* Modal */
.scrim { position: fixed; inset: 0; background: var(--scrim); display: grid; place-items: center; z-index: 60; padding: 16px; grid-template-columns: minmax(0, 1fr); }
.modal { background: var(--bg); border-radius: 14px; width: 520px; max-width: 100%; padding: 24px; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 20px 60px rgba(0,0,0,.25); max-height: 90vh; overflow-y: auto; justify-self: center; }
.modal h2 { font-size: 20px; font-weight: 800; }
.modal label.f, .modal fieldset.f { display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600; border: 0; padding: 0; margin: 0; }
.modal .f small { font-weight: 400; color: var(--muted); }
.modal legend { padding: 0; margin-bottom: 6px; }
.modal input[type=text], .modal select, .modal textarea { border: 1.5px solid var(--line); border-radius: 8px; padding: 10px 12px; background: var(--bg); font-weight: 400; width: 100%; font: inherit; }
.modal textarea { resize: vertical; }
.checks { display: flex; flex-wrap: wrap; gap: 8px; }
.checks label { display: flex; align-items: center; gap: 7px; border: 1.5px solid var(--line-soft); border-radius: 8px; padding: 7px 11px; font-weight: 400; cursor: pointer; }
.checks label:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.checks input { accent-color: var(--accent); }
.modal .err { color: var(--bad); font-weight: 600; font-size: 13px; }
.modal .foot { display: flex; justify-content: flex-end; gap: 10px; flex-wrap: wrap; }

@media (max-width: 1180px) {
  .app.has-panel { grid-template-columns: 248px minmax(0, 1fr); }
  .panel { position: fixed; top: 0; right: 0; bottom: 0; width: min(440px, 100vw); z-index: 50; box-shadow: -10px 0 40px rgba(0,0,0,.18);
    padding-top: calc(22px + env(safe-area-inset-top, 0px)); padding-bottom: calc(22px + env(safe-area-inset-bottom, 0px)); padding-right: max(22px, env(safe-area-inset-right, 0px)); }
}
@media (max-width: 860px) {
  .app.has-panel { grid-template-columns: minmax(0, 1fr); }
  .content { padding-top: 10px; }
  .stat { padding: 12px; }
  .top-row .btn.primary { width: 100%; }
  .filters label { flex: 1; min-width: 140px; }
  .filters select { flex: 1; }

  thead { display: none; }
  table, tbody, tr, td { display: block; }
  tr { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 12px; padding: 12px 14px; border-bottom: 1px solid var(--line-soft); }
  tbody tr:last-child { border-bottom: 0; }
  td { padding: 0; border: 0; grid-column: 1; }
  td.chev { grid-column: 2; grid-row: 1 / span 5; align-self: center; }
  td[data-label]::before { content: attr(data-label) ": "; color: var(--muted); }
  tr.click:hover td, tr.sel td { background: none; }
  tr.sel { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
  tr.sel td:first-child { box-shadow: none; }
}
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <main class="content" id="content"></main>
  </div>
  <aside class="panel" id="panel" hidden></aside>
</div>
<div id="modal-root"></div>
<div class="toast" id="toast" hidden></div>

<script src="shell.js"></script>
<script>
const TEAMS = ["Engineering", "Design", "Marketing"];
const OWNERS = ["Arjun", "Diya", "Priya"];
const STATUSES = ["Active", "Inactive"];

let uid = 1;
const role = (name, purpose, owner, teams, status) => ({
  id: "r" + uid++, name, purpose, owner, teams, status,
  instructions: "Instructions go here.", tools: ["Tool name 1", "Tool name 2"], links: ["Link or resource"], missions: ["Mission title"],
});
const S = {
  roles: [
    role("Code Reviewer", "Reviews code for issues", "Arjun", ["Engineering"], "Active"),
    role("Research Assistant", "Gathers and analyses information", "Diya", ["Design"], "Active"),
    role("Content Writer", "Drafts marketing content", "Priya", ["Marketing"], "Inactive"),
  ],
  team: "", status: "", open: null,
};

const $ = (s) => document.querySelector(s);
const esc = Shell.esc;
const toast = Shell.toast;
const lines = (v) => v.split("\n").map((x) => x.trim()).filter(Boolean);

/* ---------- Render ---------- */
function render() {
  const active = S.roles.filter((r) => r.status === "Active").length;
  $("#content").innerHTML = `
    <div class="top-row">
      <div class="stat"><span>Total AI workflows</span><b>${S.roles.length}</b></div>
      <div class="stat"><span>Current active workflows</span><b>${active}</b></div>
      <button class="btn primary" data-action="create">Create AI role</button>
    </div>
    <div class="filters">
      <label>Team <select id="f-team" aria-label="Filter by team"><option value="">All teams</option>${TEAMS.map((t) => `<option ${S.team === t ? "selected" : ""}>${t}</option>`).join("")}</select></label>
      <label>Status <select id="f-status" aria-label="Filter by status"><option value="">All statuses</option>${STATUSES.map((s) => `<option ${S.status === s ? "selected" : ""}>${s}</option>`).join("")}</select></label>
    </div>
    <div class="tw" id="table"></div>`;
  renderTable();
  renderPanel();
}

function renderTable() {
  const rows = S.roles.filter((r) => (!S.team || r.teams.includes(S.team)) && (!S.status || r.status === S.status));
  $("#table").innerHTML = `<table>
    <thead><tr><th>AI Role</th><th>Purpose</th><th>Owner</th><th>Team</th><th>Status</th><th class="chev"></th></tr></thead>
    <tbody>${rows.map((r) => `<tr class="click ${S.open === r.id ? "sel" : ""}" tabindex="0" data-action="open" data-id="${r.id}" aria-label="View ${esc(r.name)}">
      <td class="name">${esc(r.name)}</td>
      <td data-label="Purpose">${esc(r.purpose)}</td>
      <td data-label="Owner">${esc(r.owner)}</td>
      <td data-label="Team">${esc(r.teams.join(", "))}</td>
      <td><span class="status ${r.status.toLowerCase()}">${r.status}</span></td>
      <td class="chev" aria-hidden="true">›</td></tr>`).join("")}</tbody></table>
    ${rows.length ? "" : `<p class="empty">No AI roles match these filters.</p>`}`;
}

function renderPanel() {
  const r = S.roles.find((x) => x.id === S.open), panel = $("#panel");
  $("#app").classList.toggle("has-panel", !!r);
  panel.hidden = !r;
  if (!r) return;
  panel.innerHTML = `
    <div class="p-head"><span class="ic">AI</span><div><h2>${esc(r.name)}</h2><span class="status ${r.status.toLowerCase()}">${r.status}</span></div>
      <button class="x" data-action="close" aria-label="Close">✕</button></div>
    <div class="sec"><h3>Instructions</h3><p>${esc(r.instructions)}</p></div>
    <div class="sec"><h3>Tools</h3>${r.tools.length ? `<div class="chips">${r.tools.map((t) => `<span class="chip">${esc(t)}</span>`).join("")}</div>` : `<p class="muted">None</p>`}</div>
    <div class="sec"><h3>Owner</h3><div class="who"><span class="av">${esc(r.owner.slice(0, 2).toUpperCase())}</span>${esc(r.owner)}</div></div>
    <div class="sec"><h3>Teams</h3><div class="chips">${r.teams.map((t) => `<span class="chip">${esc(t)}</span>`).join("")}</div></div>
    <div class="sec"><h3>Missions</h3>${r.missions.length ? `<div class="missions">${r.missions.map((m) => `<div class="mission">⚑ ${esc(m)}</div>`).join("")}</div>` : `<p class="muted">Not involved in any missions yet.</p>`}</div>
    <div class="p-foot"><button class="btn" data-action="edit" data-id="${r.id}">Edit</button></div>`;
}

/* ---------- Create / edit ---------- */
function roleForm(r) {
  const editing = !!r;
  r = r || { name: "", purpose: "", instructions: "", tools: [], links: [], owner: OWNERS[0], teams: [] };
  $("#modal-root").innerHTML = `<div class="scrim" data-action="scrim"><form class="modal" id="mform" role="dialog" aria-modal="true" aria-label="${editing ? "Edit AI role" : "Create AI role"}">
    <h2>${editing ? "Edit AI role" : "Create AI role"}</h2>
    <label class="f">Role name <small>What the role is called.</small><input id="m-name" name="name" type="text" value="${esc(r.name)}"></label>
    <label class="f">Purpose <small>What it is responsible for.</small><input id="m-purpose" name="purpose" type="text" value="${esc(r.purpose)}"></label>
    <label class="f">Instructions <small>How it should perform its work.</small><textarea id="m-instr" name="instructions" rows="3">${esc(r.instructions)}</textarea></label>
    <label class="f">Tools and integrations <small>What it can access or use. One per line.</small><textarea id="m-tools" name="tools" rows="2">${esc(r.tools.join("\n"))}</textarea></label>
    <label class="f">Links or resources <small>Relevant references it needs. One per line.</small><textarea id="m-links" name="links" rows="2">${esc(r.links.join("\n"))}</textarea></label>
    <label class="f">Owner <small>The human responsible for looking after the role.</small><select id="m-owner" name="owner">${OWNERS.map((o) => `<option ${r.owner === o ? "selected" : ""}>${o}</option>`).join("")}</select></label>
    <fieldset class="f"><legend>Team <small>Which team or teams the role is available to.</small></legend>
      <div class="checks">${TEAMS.map((t) => `<label><input type="checkbox" name="teams" value="${t}" ${r.teams.includes(t) ? "checked" : ""}>${t}</label>`).join("")}</div></fieldset>
    <span class="err" id="merr" hidden></span>
    <div class="foot"><button type="button" class="btn" data-action="close-modal">Cancel</button><button class="btn primary" type="submit">${editing ? "Save" : "Create AI role"}</button></div>
  </form></div>`;
  const f = $("#mform");
  $("#m-name").focus();
  f.addEventListener("submit", (e) => {
    e.preventDefault();
    const d = new FormData(f), teams = d.getAll("teams");
    const err = (m) => { const el = $("#merr"); el.textContent = m; el.hidden = false; };
    if (!d.get("name").trim()) return err("Enter a role name.");
    if (!lines(d.get("tools")).length) return err("Add at least one tool or integration.");
    if (!lines(d.get("links")).length) return err("Add at least one link or resource.");
    if (!teams.length) return err("Choose at least one team.");
    const vals = { name: d.get("name").trim(), purpose: d.get("purpose").trim(), instructions: d.get("instructions").trim(),
      tools: lines(d.get("tools")), links: lines(d.get("links")), owner: d.get("owner"), teams };
    if (editing) { Object.assign(r, vals); toast("Saved"); }
    else { const nr = { id: "r" + uid++, status: "Active", missions: [], ...vals }; S.roles.push(nr); S.open = nr.id; toast(`Created ${nr.name}`); }
    closeModal(); render();
  });
}
const closeModal = () => ($("#modal-root").innerHTML = "");

/* ---------- Events ---------- */
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-action]");
  if (!el) return;
  switch (el.dataset.action) {
    case "create": roleForm(); break;
    case "open": S.open = el.dataset.id; renderTable(); renderPanel(); break;
    case "close": S.open = null; renderTable(); renderPanel(); break;
    case "edit": roleForm(S.roles.find((r) => r.id === el.dataset.id)); break;
    case "close-modal": closeModal(); break;
    case "scrim": if (e.target === el) closeModal(); break;
  }
});
document.addEventListener("change", (e) => {
  if (e.target.id === "f-team") { S.team = e.target.value; renderTable(); }
  if (e.target.id === "f-status") { S.status = e.target.value; renderTable(); }
});
document.addEventListener("keydown", (e) => {
  const row = e.target.closest?.("tr.click");
  if (row && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); row.click(); }
  if (e.key === "Escape") {
    if ($("#modal-root").innerHTML) closeModal();
    else if (S.open) { S.open = null; renderTable(); renderPanel(); }
  }
});

Shell.mount("workforce", { title: "AI Workforce" });
render();
</script>
</body>
</html>
